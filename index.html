<!DOCTYPE html>

<head>

    <link href="https://api.fontshare.com/v2/css?f[]=new-title@400,700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        
        .brutalist-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 995; opacity: 1;
            transition: opacity 0.3s ease; pointer-events: auto; padding: -4px 20px 20px 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        .event-content { position: relative; width: 100vw; overflow: hidden; margin-left: -20px; margin-right: -20px; margin-top: 20px; padding-top: 80px; }
        .event-carousel { display: flex; transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform; }
        .event-carousel.dragging { transition: none; }
        .event-slide { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 20px; box-sizing: border-box; }

        .brutalist-text {
            font-family: 'Bebas Neue', sans-serif; font-weight: 400; color: #B5C4D8; text-align: center;
            padding: 0; margin: 0; line-height: 0.85; letter-spacing: -0.06em;
        }
        .event-slide .brutalist-text.day { font-size: 21px !important; margin-bottom: 4px; }
        .event-slide .brutalist-text.date {
            font-family: 'New Title', 'Bebas Neue', sans-serif !important; font-size: 75px !important; font-weight: 700 !important;
            margin-bottom: 4px; line-height: 0.75; letter-spacing: -0.02em; text-transform: uppercase;
        }
        .date-line { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 4px; }
        .event-slide .day-circle {
            width: 72px !important; height: 72px !important; border: 2px solid #B5C4D8; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transform: scaleY(0.6); position: relative;
        }
        .day-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scaleY(1.67); }
        .event-slide .brutalist-text.eventname {
            font-family: 'New Title', 'Bebas Neue', sans-serif !important; font-size: 116px !important; font-weight: 700 !important;
            margin-bottom: 4px; line-height: 0.85; letter-spacing: -0.01em; text-transform: uppercase;
        }
        .event-slide .brutalist-text.time-label { font-size: 31px !important; margin-bottom: 2px; }
        .event-slide .brutalist-text.venue-text { font-size: 35px !important; padding-top: 5px !important; }

        .logo-section { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 998; pointer-events: none; }
        .rampa-logo { width: 120px; height: auto; color: #B5C4D8; }

        .contributors-section {
            position: fixed; bottom: 10px; left: 10px; right: 10px; z-index: 998; font-family: 'Inter', sans-serif;
            font-size: 10px; font-weight: 300; color: #B5C4D8; line-height: 1.0; letter-spacing: 0.01em; pointer-events: none; margin-top: 98px;
        }
        .contributors-tags { display: flex; flex-wrap: wrap; gap: 1px; margin-bottom: 8px; position: relative; pointer-events: auto; justify-content: center; }
        .event-wrapper { position: relative; display: inline-block; margin: 0; pointer-events: auto; }

        .sliding-tag {
            position: absolute; background: #B5C4D8; border: none; border-radius: 12px; padding: 2px 4px; font-size: 10px;
            font-weight: 300; color: black; white-space: nowrap; pointer-events: none; z-index: 5;
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1); opacity: 0; min-width: 20px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center; height: 14px; transform: translateY(-1px);
            will-change: transform, width, opacity, left, top;
        }
        .sliding-tag.dragging { transition: none; }

        .event-text {
            color: #B5C4D8; font-size: 10px; font-weight: 300; padding: 2px 4px; cursor: pointer;
            transition: color 0.4s ease, background-color 0.4s ease, border-radius 0.4s ease; 
            white-space: nowrap; display: inline-block; margin: 0; letter-spacing: 0.01em; pointer-events: auto; position: relative;
            z-index: 10; line-height: 1.0; box-sizing: border-box;
        }
        .event-text:hover { color: #D4E2F2; }
        .event-text.has-tag { 
            color: black; background: #B5C4D8; border-radius: 12px; 
        }

        .add-event-button {
            position: fixed; right: 20px; top: 20px; width: 50px; height: 50px; cursor: pointer;
            transition: all 0.3s ease; pointer-events: auto; z-index: 999; background: transparent;
            border: none; padding: 0; opacity: 0.8;
        }
        .add-event-button:hover { transform: scale(1.1); opacity: 1; }
        .add-event-button.active { transform: scale(0.95); opacity: 1; }
        .add-event-button svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3)); }

        .event-form-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 998; display: flex; align-items: center; justify-content: center; opacity: 0;
            visibility: hidden; transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .event-form-overlay.visible { opacity: 1; visibility: visible; }

        .event-form {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px; 
            padding: 32px;
            width: 90%; 
            max-width: 380px; 
            font-family: 'Inter', sans-serif; 
            transform: scale(0.85) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 1px 0 rgba(255, 255, 255, 0.1) inset,
                0 -1px 0 rgba(0, 0, 0, 0.1) inset;
        }
        .event-form-overlay.visible .event-form { 
            transform: scale(1) translateY(0px); 
        }

        .form-title {
            font-family: 'Inter', sans-serif; 
            font-size: 22px; 
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9); 
            text-align: center;
            margin-bottom: 28px; 
            letter-spacing: -0.02em;
        }
        
        .form-group { 
            margin-bottom: 18px; 
        }
        
        .form-row {
            display: flex;
            gap: 12px;
        }
        
        .form-input-half {
            flex: 1;
        }
        
        .form-input, .form-select {
            width: 100%; 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; 
            padding: 16px 18px;
            color: rgba(255, 255, 255, 0.9); 
            font-family: 'Inter', sans-serif; 
            font-size: 15px; 
            font-weight: 400;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            letter-spacing: -0.01em;
            min-height: 52px; /* Altura mínima uniforme */
            height: 52px; /* Altura fija para consistencia */
            line-height: 1.2;
        }
        
        /* Ajustes específicos para inputs de fecha y hora */
        .form-input[type="date"], 
        .form-input[type="time"] {
            padding: 14px 18px; /* Padding ligeramente menor para compensar el contenido interno */
            display: flex;
            align-items: center;
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            transition: all 0.3s ease;
        }
        
        .form-input:focus::placeholder {
            opacity: 0;
            transform: translateY(-4px);
        }
        
        .form-input:focus, .form-select:focus { 
            outline: none; 
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }
        
        /* Estilos especiales para inputs de fecha y hora */
        .form-input[type="date"]::-webkit-calendar-picker-indicator,
        .form-input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(0.6);
            cursor: pointer;
        }
        
        .form-input[type="date"]::-webkit-inner-spin-button,
        .form-input[type="time"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* Color de texto para date/time cuando están seleccionados */
        .form-input[type="date"]:valid,
        .form-input[type="time"]:valid {
            color: rgba(255, 255, 255, 0.9);
        }
        
        .form-select { 
            cursor: pointer; 
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='rgba(255,255,255,0.5)' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 16px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 44px;
        }
        
        /* Estilos para las opciones del select */
        .form-select option {
            background: rgba(30, 30, 30, 0.95);
            color: rgba(255, 255, 255, 0.9);
            padding: 10px;
        }

        .form-buttons { 
            display: flex; 
            gap: 12px; 
            margin-top: 28px; 
        }
        
        .form-button {
            flex: 1; 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 14px; 
            padding: 14px 20px;
            color: rgba(255, 255, 255, 0.8); 
            font-family: 'Inter', sans-serif; 
            font-size: 14px; 
            font-weight: 400;
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            letter-spacing: -0.01em;
            position: relative;
            overflow: hidden;
        }
        
        .form-button:hover { 
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.95);
            transform: translateY(-1px);
        }
        
        .form-button.submit { 
            background: rgba(255, 0, 0, 0.15);
            border-color: rgba(255, 0, 0, 0.3); 
            color: rgba(255, 0, 0, 1);
            font-weight: 500;
        }
        
        .form-button.submit:hover { 
            background: rgba(255, 0, 0, 0.25);
            border-color: rgba(255, 0, 0, 0.4);
            color: rgba(255, 0, 0, 1);
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.2);
        }
        
        .form-button:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
            transform: none;
        }

        .success-message {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(255, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white; 
            padding: 16px 24px; 
            border-radius: 16px; 
            font-family: 'Inter', sans-serif;
            font-size: 14px; 
            font-weight: 500; 
            z-index: 999; 
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .success-message.visible { opacity: 1; visibility: visible; }

        .loading-message {
            color: #B5C4D8; font-family: 'Inter', sans-serif; font-size: 12px; text-align: center;
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;
        }

        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const MSCHFEventsBillboard = () => {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({ nombre: '', fecha: '', hora: '', lugar: '', categoria: 'RAVE' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [selectedEvent, setSelectedEvent] = useState(null);
            const [brutalistEventData, setBrutalistEventData] = useState(null);
            const [currentEventIndex, setCurrentEventIndex] = useState(0);
            const [startX, setStartX] = useState(0);
            const [isSwipping, setIsSwipping] = useState(false);
            const overlayRef = useRef(null);
            const [carouselOffset, setCarouselOffset] = useState(0);
            const [isDraggingCarousel, setIsDraggingCarousel] = useState(false);
            const [isDraggingTag, setIsDraggingTag] = useState(false);
            const [eventPositions, setEventPositions] = useState([]);
            const tagsContainerRef = useRef(null);

            // 🔥 CONFIGURACIÓN FINAL - CORS SOLUCIONADO CON GET
            const CONFIG = {
                // 📧 Tu email donde quieres recibir los eventos
                EMAIL_DESTINO: 'milarepa775@gmail.com',
                
                // 📊 Nueva URL Apps Script (CORS solucionado con GET)
                GOOGLE_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxr87QHb4gyd4biNdxF4-7j2DhVK1DiXc7CWO5y3e2Iu_jDnJaiDdbBn2DAlTOCVZsEUg/exec'
            };

            // 🔥 FUNCIÓN DE TEST: Verificar conexión con Apps Script
            const testGoogleSheetsConnection = async () => {
                try {
                    console.log('🧪 === TEST DE CONEXIÓN APPS SCRIPT ===');
                    console.log('🔗 URL a probar:', CONFIG.GOOGLE_SCRIPT_URL);
                    
                    // Test GET primero
                    console.log('📡 Probando GET...');
                    const getResponse = await fetch(`${CONFIG.GOOGLE_SCRIPT_URL}?action=test&t=${Date.now()}`);
                    console.log('📨 GET Response:', getResponse.status, getResponse.statusText);
                    
                    if (getResponse.ok) {
                        const getText = await getResponse.text();
                        console.log('✅ GET exitoso:', getText);
                    } else {
                        console.log('❌ GET falló:', getResponse.status);
                    }
                    
                    // Test POST ahora
                    console.log('📡 Probando POST...');
                    const postPayload = {
                        nombre: 'Test Conexión',
                        fecha: '2025-08-22',
                        hora: '15:30',
                        lugar: 'Test Location',
                        categoria: 'RAVE',
                        dia: 'JUEVES'
                    };
                    
                    const postResponse = await fetch(CONFIG.GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(postPayload)
                    });
                    
                    console.log('📨 POST Response:', postResponse.status, postResponse.statusText);
                    
                    if (postResponse.ok) {
                        const postText = await postResponse.text();
                        console.log('✅ POST exitoso:', postText);
                        return { success: true, message: 'Conexión funcionando' };
                    } else {
                        console.log('❌ POST falló:', postResponse.status);
                        return { success: false, error: `POST falló: ${postResponse.status}` };
                    }
                    
                } catch (error) {
                    console.log('💥 Error de conexión:', error);
                    return { success: false, error: error.message };
                }
            };
            // 🔥 FUNCIÓN NUEVA: Enviar usando GET (sin CORS)
            const submitToGoogleSheets = async (eventData) => {
                try {
                    console.log('📊 === ENVIANDO VIA GET (SIN CORS) ===');
                    console.log('📊 URL del Apps Script:', CONFIG.GOOGLE_SCRIPT_URL);
                    console.log('📊 Datos del evento:', eventData);
                    
                    // Construir URL con parámetros GET
                    const params = new URLSearchParams({
                        action: 'submitEvent',
                        nombre: eventData.nombre,
                        fecha: eventData.fecha,
                        hora: eventData.hora,
                        lugar: eventData.lugar,
                        categoria: eventData.categoria,
                        dia: eventData.dia
                    });
                    
                    const fullUrl = `${CONFIG.GOOGLE_SCRIPT_URL}?${params.toString()}`;
                    console.log('📤 URL completa:', fullUrl);
                    
                    console.log('📡 Iniciando fetch GET...');
                    
                    const response = await fetch(fullUrl, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                        }
                    });

                    console.log('📨 Respuesta recibida:');
                    console.log('  - Status:', response.status);
                    console.log('  - StatusText:', response.statusText);
                    console.log('  - OK:', response.ok);
                    
                    if (response.ok) {
                        console.log('✅ Response OK, leyendo texto...');
                        const responseText = await response.text();
                        console.log('📄 Texto completo de respuesta:', responseText);
                        
                        if (responseText.trim() === '') {
                            console.log('⚠️ Respuesta vacía');
                            return { success: false, error: 'Respuesta vacía del servidor' };
                        }
                        
                        try {
                            const result = JSON.parse(responseText);
                            console.log('📊 JSON parseado exitosamente:', result);
                            
                            if (result.success) {
                                console.log('✅ SUCCESS: Evento guardado en Google Sheets');
                                return { success: true, data: result };
                            } else {
                                console.log('❌ Apps Script reportó error:', result.error);
                                return { success: false, error: result.error || 'Error del servidor' };
                            }
                        } catch (parseError) {
                            console.log('⚠️ Error parseando JSON:', parseError);
                            console.log('⚠️ Respuesta que no se pudo parsear:', responseText);
                            return { success: false, error: 'Respuesta inválida del servidor' };
                        }
                    } else {
                        console.log('❌ HTTP Error:', response.status, response.statusText);
                        try {
                            const errorText = await response.text();
                            console.log('❌ Texto de error:', errorText);
                            return { success: false, error: `HTTP ${response.status}: ${errorText}` };
                        } catch (e) {
                            return { success: false, error: `HTTP ${response.status}: ${response.statusText}` };
                        }
                    }
                } catch (error) {
                    console.log('💥 === ERROR CRÍTICO ===');
                    console.error('❌ Error completo:', error);
                    
                    if (error.name === 'TypeError' && error.message.includes('fetch')) {
                        return { success: false, error: 'Error de conexión - verifica la URL del Apps Script' };
                    } else {
                        return { success: false, error: `Error de red: ${error.message}` };
                    }
                }
            };

            // 🔥 FUNCIÓN: Enviar email como backup usando FormSubmit
            const submitByEmail = async (eventData) => {
                try {
                    console.log('📧 Enviando email backup...');
                    
                    const formData = new FormData();
                    formData.append('_to', CONFIG.EMAIL_DESTINO);
                    formData.append('_subject', `🎉 Nuevo Evento RAMPA: ${eventData.nombre}`);
                    formData.append('_captcha', 'false');
                    formData.append('_template', 'box');
                    
                    // Datos del evento
                    formData.append('🎵 Evento', eventData.nombre);
                    formData.append('📅 Fecha', eventData.fecha);
                    formData.append('🕐 Hora', eventData.hora);
                    formData.append('📍 Lugar', eventData.lugar || 'No especificado');
                    formData.append('🏷️ Categoría', eventData.categoria);
                    formData.append('📝 Día', eventData.dia);
                    formData.append('⏰ Enviado', new Date().toLocaleString('es-UY'));

                    const response = await fetch(`https://formsubmit.co/ajax/${CONFIG.EMAIL_DESTINO}`, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    console.log('📧 Email enviado:', result);
                    
                    return result.success === 'true' || result.success === true;
                } catch (error) {
                    console.error('❌ Error enviando email:', error);
                    return false;
                }
            };

            // 🔥 FUNCIÓN ACTUALIZADA: Cargar eventos desde tu Apps Script funcionando
            const loadEventsFromGoogleSheets = async () => {
                try {
                    console.log('📊 Cargando eventos desde Google Sheets...');
                    
                    // Tu Apps Script maneja GET automáticamente
                    const response = await fetch(`${CONFIG.GOOGLE_SCRIPT_URL}?action=getApprovedEvents&t=${Date.now()}`);
                    
                    if (response.ok) {
                        const responseText = await response.text();
                        console.log('📄 Respuesta cruda:', responseText);
                        
                        try {
                            const data = JSON.parse(responseText);
                            console.log('📊 Datos parseados:', data);
                            
                            if (data.success && data.events && data.events.length > 0) {
                                console.log(`✅ Cargados ${data.events.length} eventos desde Google Sheets`);
                                
                                const formattedEvents = data.events.map((event, index) => {
                                    console.log('📊 Evento crudo desde Google Sheets:', event);
                                    
                                    const formattedEvent = {
                                        id: index + 1,
                                        name: event.Nombre || 'Sin título',
                                        date: formatDate(event.Fecha),
                                        time: formatTime(event.Hora),
                                        venue: event.Lugar || '',
                                        category: event.Categoría || 'EVENTO',
                                        day: event.Día || getDayOfWeek(event.Fecha)
                                    };
                                    
                                    console.log('✅ Evento formateado:', formattedEvent);
                                    return formattedEvent;
                                });

                                console.log('✅ Eventos formateados:', formattedEvents);
                                return formattedEvents;
                            } else {
                                console.log('⚠️ No hay eventos o respuesta vacía:', data);
                                return null;
                            }
                        } catch (parseError) {
                            console.log('❌ Error parseando respuesta:', parseError);
                            console.log('Respuesta que falló:', responseText);
                            return null;
                        }
                    } else {
                        console.error('❌ Error en respuesta HTTP:', response.status, response.statusText);
                        return null;
                    }
                } catch (error) {
                    console.error('❌ Error cargando eventos:', error);
                    return null;
                }
            };

            // 🔥 FUNCIÓN PRINCIPAL: Manejar envío de eventos
            const handleSubmitEvent = async (e) => {
                e.preventDefault();
                
                if (!formData.nombre || !formData.fecha || !formData.hora) {
                    alert('Por favor completa todos los campos requeridos');
                    return;
                }
                
                setIsSubmitting(true);
                
                try {
                    const day = getDayOfWeek(formData.fecha);
                    const eventToSubmit = {
                        nombre: formData.nombre,
                        fecha: formData.fecha,
                        hora: formData.hora,
                        lugar: formData.lugar,

                    // 1. Intentar enviar a Google Sheets PRIMERO

                    // 2. Enviar email como backup/notificación

                    // 3. Mostrar resultado detallado
                    if (sheetsResult.success) {

                }

            // 🔥 FUNCIÓN MEJORADA: Formatear fecha correctamente
            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                
                console.log('🔍 Formateando fecha:', dateStr, typeof dateStr);
                
                // Si ya está en formato DD.MM.AA correcto, devolverlo
                if (typeof dateStr === 'string' && /^\d{2}\.\d{2}\.\d{2}$/.test(dateStr)) {
                    console.log('✅ Fecha ya en formato DD.MM.AA:', dateStr);
                    return dateStr;
                }
                
                // Si viene como timestamp extraño o string raro, limpiar
                if (typeof dateStr === 'string' && dateStr.includes('Z')) {
                    console.log('⚠️ Fecha con timestamp extraño:', dateStr);
                    // Extraer solo la parte de fecha inicial si es posible
                    const match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
                    if (match) {
                        const [_, year, month, day] = match;
                        const shortYear = year.slice(-2);
                        console.log('🔧 Fecha extraída:', `${day}.${month}.${shortYear}`);
                        return `${day}.${month}.${shortYear}`;
                    }
                }
                
                // Si ya está en formato DD.MM.AA pero mal formateado, arreglar padding
                if (typeof dateStr === 'string' && dateStr.includes('.')) {
                    const parts = dateStr.split('.');
                    if (parts.length === 3) {
                        const day = String(parts[0]).padStart(2, '0');
                        const month = String(parts[1]).padStart(2, '0');
                        const year = parts[2].length === 2 ? parts[2] : String(parts[2]).slice(-2);
                        const formatted = `${day}.${month}.${year}`;
                        console.log('🔧 Fecha reformateada:', formatted);
                        return formatted;
                    }
                }
                
                try {
                    // Intentar parsear como fecha normal
                    let date;
                    if (typeof dateStr === 'string' && dateStr.includes('-')) {
                        // Formato YYYY-MM-DD
                        date = new Date(dateStr.split('T')[0] + 'T00:00:00');
                    } else {
                        date = new Date(dateStr);
                    }
                    
                    if (!isNaN(date.getTime())) {
                        const day = String(date.getDate()).padStart(2, '0');
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const year = String(date.getFullYear()).slice(-2);
                        const formatted = `${day}.${month}.${year}`;
                        console.log('🔧 Fecha parseada:', formatted);
                        return formatted;
                    }
                } catch (e) {
                    console.warn('❌ Error parseando fecha:', dateStr, e);
                }
                
                console.warn('⚠️ No se pudo formatear fecha, devolviendo original:', dateStr);
                return String(dateStr);
            };

            // 🔥 FUNCIÓN MEJORADA: Formatear hora correctamente y forzar :00 o :30
            const formatTime = (timeStr) => {
                if (!timeStr) return '00:00';
                
                let hours = 0;
                let minutes = 0;
                
                // Si ya está en formato HH:MM, extraer horas y minutos
                if (typeof timeStr === 'string' && timeStr.includes(':')) {
                    const [h, m] = timeStr.split(':');
                    hours = parseInt(h) || 0;
                    minutes = parseInt(m) || 0;
                } 
                // Si es un número (como 23.5 para 23:30)
                else if (typeof timeStr === 'number') {
                    hours = Math.floor(timeStr);
                    minutes = Math.round((timeStr - hours) * 60);
                }
                // Si es string sin :, asumir formato HHMM
                else if (typeof timeStr === 'string') {
                    const cleanTime = timeStr.replace(/[^\d:]/g, '');
                    
                    if (cleanTime.includes(':')) {
                        const [h, m] = cleanTime.split(':');
                        hours = parseInt(h) || 0;
                        minutes = parseInt(m) || 0;
                    } else if (cleanTime.length >= 3) {
                        hours = parseInt(cleanTime.substring(0, cleanTime.length - 2)) || 0;
                        minutes = parseInt(cleanTime.substring(cleanTime.length - 2)) || 0;
                    }

                if (minutes < 15) {
                    minutes = 0;  // 0-14 → :00
                } else if (minutes < 45) {
                    minutes = 30; // 15-44 → :30
                } else {

                                <path d="M211.5 136.021C211.5 140.716 207.695 144.521 203 144.521L150.5 144.521C143.873 144.521 138.5 149.893 138.5 156.521V209.021C138.5 213.715 134.695 217.521 130 217.521C125.306 217.521 121.5 213.715 121.499 209.021V156.521C121.5 149.893 116.128 144.521 109.501 144.521L56.9997 144.521C52.3057 144.521 48.5001 140.715 48.4997 136.021C48.5001 131.326 52.3057 127.521 56.9999 127.521L109.5 127.521C116.128 127.52 121.5 122.148 121.5 115.521L121.5 63.0208C121.5 58.3264 125.306 54.5209 130 54.5209C134.694 54.5209 138.5 58.3264 138.5 63.0209L138.5 115.521C138.5 122.149 143.872 127.521 150.5 127.52L203 127.521C207.695 127.521 211.5 131.327 211.5 136.021Z" fill="#B5C4D8"/>

                            <defs>
                                <clipPath id="clip0_1549_5630">
                                    <rect width="260" height="273" fill="white"/>
                                </clipPath>
                            </defs>
                        </svg>
                    </button>

                    {/* Formulario modal para agregar evento */}
                    <div className={`event-form-overlay ${showForm ? 'visible' : ''}`}>
                        <form className="event-form" onSubmit={handleSubmitEvent}>
                            <h2 className="form-title">Agregar Evento</h2>
                            
                            <div className="form-group">
                                <input 
                                    type="text"
                                    className="form-input"
                                    value={formData.nombre}
                                    onChange={(e) => handleFormChange('nombre', e.target.value)}
                                    placeholder="Nombre del evento *"
                                    required
                                />
                            </div>

                            <div className="form-group form-row">
                                <input 
                                    type="date"
                                    className="form-input form-input-half"
                                    value={formData.fecha}
                                    onChange={(e) => handleFormChange('fecha', e.target.value)}
                                    placeholder="Fecha *"
                                    required
                                />
                                <input 
                                    type="time"
                                    className="form-input form-input-half"
                                    value={formData.hora}
                                    onChange={(e) => handleFormChange('hora', e.target.value)}
                                    placeholder="Hora *"
                                    step="1800"
                                    required
                                />
                            </div>

                            <div className="form-group">
                                <input 
                                    type="text"
                                    className="form-input"
                                    value={formData.lugar}
                                    onChange={(e) => handleFormChange('lugar', e.target.value)}
                                    placeholder="Lugar / Artistas"
                                />
                            </div>

                            <div className="form-group">
                                <select 
                                    className="form-select"
                                    value={formData.categoria}
                                    onChange={(e) => handleFormChange('categoria', e.target.value)}
                                >
                                    <option value="" disabled style={{display: 'none'}}>Categoría</option>
                                    <option value="RAVE">RAVE</option>
                                    <option value="ARTE">ARTE</option>
                                    <option value="MUSICA">MÚSICA</option>
                                    <option value="BAR">BAR</option>
                                    <option value="AIRE LIBRE">AIRE LIBRE</option>
                                </select>
                            </div>

                            <div className="form-buttons">
                                <button 
                                    type="button" 
                                    className="form-button"
                                    onClick={toggleForm}
                                    disabled={isSubmitting}
                                >
                                    Cancelar
                                </button>
                                <button 
                                    type="submit" 
                                    className="form-button submit"
                                    disabled={isSubmitting}
                                >
                                    {isSubmitting ? 'Enviando...' : 'Enviar'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<MSCHFEventsBillboard />, document.getElementById('root'));
    </script>
</body>
</html>
