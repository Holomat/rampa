<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTOS</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&family=Inter:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=new-title@400,700&display=swap" rel="stylesheet">
    <style>
        .brutalist-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 995;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
            padding: -4px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Contenedor de evento con carousel */
        .event-content {
            position: relative;
            width: 100vw;
            overflow: hidden;
            margin-left: -20px;
            margin-right: -20px;
            margin-top: -60px;
        }

        .event-carousel {
            display: flex;
            transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .event-carousel.dragging {
            transition: none;
        }

        .event-slide {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .brutalist-text {
            font-family: 'Bebas Neue', sans-serif;
            font-weight: 400;
            color: #B8B0A3;
            text-align: center;
            filter: blur(0.3px);
            padding: 0;
            margin: 0;
            line-height: 0.85;
            letter-spacing: -0.06em;
        }

        /* TAMAÑOS REDUCIDOS 10% PARA EL AFICHE */
        .event-slide .brutalist-text.day {
            font-size: 21px !important;
            margin-bottom: 4px;
        }

        .event-slide .brutalist-text.date {
            font-family: 'New Title', 'Bebas Neue', sans-serif !important;
            font-size: 75px !important;
            font-weight: 700 !important;
            margin-bottom: 4px;
            line-height: 0.75;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .date-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 4px;
        }

        .event-slide .day-circle {
            width: 72px !important;
            height: 72px !important;
            border: 2px solid #B8B0A3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scaleY(0.6);
            position: relative;
        }

        .day-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scaleY(1.67);
            filter: blur(0.2px);
        }

        .event-slide .brutalist-text.eventname {
            font-family: 'New Title', 'Bebas Neue', sans-serif !important;
            font-size: 116px !important;
            font-weight: 700 !important;
            margin-bottom: 4px;
            line-height: 0.85;
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }

        .event-slide .brutalist-text.time-label {
            font-size: 31px !important;
            margin-bottom: 2px;
        }

        .event-slide .brutalist-text.venue-text {
            font-size: 35px !important;
            padding-top: 5px !important;
        }

        .logo-section {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 998;
            pointer-events: none;
        }

        .rampa-logo {
            width: 120px;
            height: auto;
            color: #B8B0A3;
            filter: blur(0.3px);
        }

        .contributors-section {
            position: fixed;
            bottom: 60px;
            left: 10px;
            right: 10px;
            z-index: 998;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 300;
            color: #B8B0A3;
            line-height: 1.0;
            letter-spacing: 0.01em;
            pointer-events: none;
            margin-top: 98px;
        }

        .contributors-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            margin-bottom: 8px;
            position: relative;
            pointer-events: auto;
            justify-content: center;
        }

        .event-wrapper {
            position: relative;
            display: inline-block;
            margin: 0;
            pointer-events: auto;
        }

        .sliding-tag {
            position: absolute;
            background: #B8B0A3;
            border: none;
            border-radius: 12px;
            padding: 2px 4px;
            font-size: 10px;
            font-weight: 300;
            color: black;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
            filter: blur(0.3px);
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 1;
            min-width: 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 14px;
            transform: translateY(-1px);
            will-change: transform, width, opacity, left, top;
        }

        .sliding-tag.dragging {
            transition: none;
        }

        .sliding-tag.smooth-horizontal {
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sliding-tag.fade-out {
            transition: opacity 0.3s ease-out;
            opacity: 0;
        }

        .sliding-tag.fade-in {
            transition: opacity 0.4s ease-in;
            opacity: 1;
        }

        .event-text {
            color: #B8B0A3;
            font-size: 10px;
            font-weight: 300;
            padding: 2px 4px;
            cursor: pointer;
            transition: color 0.4s ease, opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            white-space: nowrap;
            display: inline-block;
            margin: 0;
            letter-spacing: 0.01em;
            pointer-events: auto;
            position: relative;
            z-index: 10;
            filter: blur(0.3px);
            line-height: 1.0;
            box-sizing: border-box;
        }

        .event-text:hover {
            color: #D4CFC2;
        }

        .event-text.has-tag {
            color: #FD7B1E;
        }

        .final-bottom-buttons {
            display: none;
        }

        .like-button {
            position: fixed;
            right: 20px;
            bottom: 40vh;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            z-index: 999;
            background: transparent;
            border: none;
            padding: 0;
            opacity: 0.8;
        }

        .like-button:hover {
            transform: scale(1.1);
            opacity: 1;
        }

        .like-button.liked {
            transform: scale(0.95);
            opacity: 1;
        }

        .like-button svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .like-button.liked svg path[fill="#FF0000"] {
            fill: #FD7B1E;
        }

        .like-button.liked svg path[stroke="#FF0000"] {
            stroke: #FD7B1E;
        }

        .like-count-overlay {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #FD7B1E;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            font-family: 'Inter', sans-serif;
            min-width: 20px;
            padding: 2px;
            box-sizing: border-box;
        }

        .event-likes-display {
            font-size: 9px;
            color: #FD7B1E;
            margin-left: 4px;
            opacity: 0.8;
        }

        .loading-message {
            color: #B8B0A3;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            text-align: center;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const MSCHFEventsBillboard = () => {
            const [events, setEvents] = useState([]);
            const [eventLikes, setEventLikes] = useState({});
            const [userLikes, setUserLikes] = useState(new Set());
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [selectedEvent, setSelectedEvent] = useState(null);
            const [showBrutalistInfo, setShowBrutalistInfo] = useState(true);
            const [brutalistEventData, setBrutalistEventData] = useState(null);
            const [currentEventIndex, setCurrentEventIndex] = useState(0);
            
            // Estados para swipe
            const [startX, setStartX] = useState(0);
            const [startY, setStartY] = useState(0);
            const [isSwipping, setIsSwipping] = useState(false);
            const overlayRef = useRef(null);
            
            // Estados para carrusel
            const [carouselOffset, setCarouselOffset] = useState(0);
            const [isDraggingCarousel, setIsDraggingCarousel] = useState(false);

            // Estados para etiqueta con physics
            const [tagPosition, setTagPosition] = useState({ x: 0, y: 0 });
            const [tagWidth, setTagWidth] = useState(60);
            const [isDraggingTag, setIsDraggingTag] = useState(false);
            const [eventPositions, setEventPositions] = useState([]);
            const [isTagVisible, setIsTagVisible] = useState(true);
            const tagsContainerRef = useRef(null);

            // Cargar likes desde localStorage al inicializar
            useEffect(() => {
                const savedLikes = localStorage.getItem('rampa-event-likes');
                const savedUserLikes = localStorage.getItem('rampa-user-likes');
                
                if (savedLikes) {
                    try {
                        setEventLikes(JSON.parse(savedLikes));
                    } catch (e) {
                        console.log('Error cargando likes guardados');
                    }
                }
                
                if (savedUserLikes) {
                    try {
                        setUserLikes(new Set(JSON.parse(savedUserLikes)));
                    } catch (e) {
                        console.log('Error cargando likes del usuario');
                    }
                }
            }, []);

            // Función para simular sincronización en tiempo real
            const syncLikesWithServer = async (eventId, newCount) => {
                // Simulación de API call - en producción conectarías con tu backend
                try {
                    // Aquí irían las llamadas reales a tu API
                    console.log(`Sincronizando likes para evento ${eventId}: ${newCount}`);
                    
                    // Simulación de respuesta del servidor con datos actualizados
                    // En producción, esto vendría de tu base de datos
                    return { success: true, totalLikes: newCount };
                } catch (error) {
                    console.error('Error sincronizando likes:', error);
                    return { success: false };
                }
            };

            // Función mejorada para dar like con sincronización
            const handleLikeEvent = async (eventId) => {
                const isCurrentlyLiked = userLikes.has(eventId);
                const newUserLikes = new Set(userLikes);
                const newEventLikes = { ...eventLikes };
                
                if (isCurrentlyLiked) {
                    newUserLikes.delete(eventId);
                    newEventLikes[eventId] = Math.max(0, (newEventLikes[eventId] || 0) - 1);
                } else {
                    newUserLikes.add(eventId);
                    newEventLikes[eventId] = (newEventLikes[eventId] || 0) + 1;
                }
                
                // Actualizar estado local inmediatamente para UX
                setUserLikes(newUserLikes);
                setEventLikes(newEventLikes);
                
                // Guardar en localStorage
                localStorage.setItem('rampa-event-likes', JSON.stringify(newEventLikes));
                localStorage.setItem('rampa-user-likes', JSON.stringify([...newUserLikes]));
                
                // Sincronizar con servidor (simulado)
                await syncLikesWithServer(eventId, newEventLikes[eventId]);
            };

            // Función para formatear fecha
            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                
                // Si ya viene en formato DD.MM.YY, lo devolvemos así
                if (dateStr.includes('.')) {
                    return dateStr;
                }
                
                // Si viene como fecha de Excel (número de serie)
                if (!isNaN(dateStr)) {
                    const excelDate = new Date((dateStr - 25569) * 86400 * 1000);
                    const day = String(excelDate.getDate()).padStart(2, '0');
                    const month = String(excelDate.getMonth() + 1).padStart(2, '0');
                    const year = String(excelDate.getFullYear()).slice(-2);
                    return `${day}.${month}.${year}`;
                }
                
                // Si viene como fecha normal
                try {
                    const date = new Date(dateStr);
                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const year = String(date.getFullYear()).slice(-2);
                    return `${day}.${month}.${year}`;
                } catch (e) {
                    return dateStr;
                }
            };

            // Función para obtener día de la semana
            const getDayOfWeek = (dateStr) => {
                try {
                    let date;
                    
                    if (!isNaN(dateStr)) {
                        // Fecha de Excel
                        date = new Date((dateStr - 25569) * 86400 * 1000);
                    } else if (dateStr.includes('.')) {
                        // Formato DD.MM.YY
                        const [day, month, year] = dateStr.split('.');
                        date = new Date(2000 + parseInt(year), parseInt(month) - 1, parseInt(day));
                    } else {
                        date = new Date(dateStr);
                    }
                    
                    const days = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
                    return days[date.getDay()];
                } catch (e) {
                    return 'FECHA';
                }
            };

            // Cargar datos desde Excel
            useEffect(() => {
                const loadEventsFromExcel = async () => {
                    try {
                        setLoading(true);
                        
                        // Lista de posibles rutas para el archivo
                        const possiblePaths = [
                            './Eventos.xlsx',
                            '/Eventos.xlsx',
                            'Eventos.xlsx',
                            './eventos.xlsx',
                            '/eventos.xlsx',
                            'eventos.xlsx'
                        ];
                        
                        let response = null;
                        let foundPath = null;
                        
                        // Intentar cargar desde diferentes rutas
                        for (const path of possiblePaths) {
                            try {
                                console.log(`Intentando cargar desde: ${path}`);
                                response = await fetch(path);
                                if (response.ok) {
                                    foundPath = path;
                                    console.log(`✅ Archivo encontrado en: ${path}`);
                                    break;
                                }
                            } catch (err) {
                                console.log(`❌ No encontrado en: ${path}`);
                                continue;
                            }
                        }
                        
                        // Si no se encontró el archivo, usar datos de ejemplo
                        if (!response || !response.ok) {
                            console.log('📄 Archivo Excel no encontrado, usando datos de ejemplo');
                            const exampleEvents = [
                                { id: 1, name: "Phonoteque", date: "17.08.25", time: "23:00", venue: "FLHEZ, FEFIO, NICOLÁS ARIN B2B STONEM", category: "RAVE", day: "DOMINGO" },
                                { id: 2, name: "Quebrada Festival", date: "22.08.25", time: "20:00", venue: "NICOLÁS JAAR, ANTHEA, LUCIANO SUPERVIELLE", category: "FESTIVAL", day: "VIERNES" },
                                { id: 3, name: "Baum Sessions", date: "23.08.25", time: "22:00", venue: "KLANGKUENSTLER, ÂVALL", category: "RAVE", day: "SÁBADO" },
                                { id: 4, name: "No Sleep Club", date: "24.08.25", time: "23:00", venue: "DANNY AVILA, LOCAL RESIDENTS", category: "CLUB", day: "DOMINGO" },
                                { id: 5, name: "Underworld MVD", date: "29.08.25", time: "23:30", venue: "BEN KLOCK, MARCEL DETTMANN", category: "RAVE", day: "VIERNES" },
                                { id: 6, name: "Electric Park", date: "30.08.25", time: "18:00", venue: "CHARLOTTE DE WITTE, AMELIE LENS", category: "FESTIVAL", day: "SÁBADO" },
                                { id: 7, name: "Mute Night", date: "05.09.25", time: "23:00", venue: "TALE OF US, MIND AGAINST", category: "RAVE", day: "VIERNES" },
                                { id: 8, name: "Cosmic Rave", date: "06.09.25", time: "22:30", venue: "MACEO PLEX, JORIS VOORN", category: "RAVE", day: "SÁBADO" },
                                { id: 9, name: "Fabric Montevideo", date: "12.09.25", time: "23:00", venue: "CRAIG RICHARDS, TERRY FRANCIS", category: "CLUB", day: "VIERNES" },
                                { id: 10, name: "Circoloco MVD", date: "13.09.25", time: "16:00", venue: "DIXON, ÂMEELIE LENS", category: "FESTIVAL", day: "SÁBADO" },
                                { id: 11, name: "Berghain Tribute", date: "19.09.25", time: "23:30", venue: "RØDHÅD, ANSWER CODE REQUEST", category: "RAVE", day: "VIERNES" },
                                { id: 12, name: "Afterlife MVD", date: "20.09.25", time: "21:00", venue: "MATHAME, KEVIN DE VRIES", category: "RAVE", day: "SÁBADO" },
                                { id: 13, name: "Tresor Night", date: "26.09.25", time: "23:00", venue: "JEFF MILLS, ROBERT HOOD", category: "RAVE", day: "VIERNES" },
                                { id: 14, name: "Sunwaves UY", date: "27.09.25", time: "12:00", venue: "RICARDO VILLALOBOS, RARESH", category: "FESTIVAL", day: "SÁBADO" }
                            ];
                            setEvents(exampleEvents);
                            setLoading(false);
                            return;
                        }
                        
                        // Leer el archivo Excel con configuración más robusta
                        const arrayBuffer = await response.arrayBuffer();
                        const workbook = XLSX.read(arrayBuffer, { 
                            type: 'array',
                            cellText: false,
                            cellDates: true
                        });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        
                        // Convertir a JSON con configuración más segura
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { 
                            header: 1,
                            defval: '',
                            raw: false
                        });
                        
                        // Verificar que hay datos válidos
                        if (jsonData.length < 2) {
                            throw new Error('El archivo Excel está vacío o no tiene datos');
                        }
                        
                        // Filtrar filas vacías y obtener headers y datos
                        const validRows = jsonData.filter(row => row && row.length > 0);
                        const headers = validRows[0] || [];
                        const rows = validRows.slice(1).filter(row => row.some(cell => cell && String(cell).trim() !== ''));
                        
                        const eventsData = rows.map((row, index) => {
                            const event = {};
                            headers.forEach((header, colIndex) => {
                                // Verificar que header sea válido y convertir a string si es necesario
                                const headerStr = header && typeof header === 'string' ? header : String(header || '');
                                const key = headerStr.toLowerCase().trim();
                                const value = row[colIndex] || '';
                                
                                // Buscar coincidencias más flexibles
                                if (key.includes('nombre') || key.includes('name') || key.includes('evento') || colIndex === 0) {
                                    event.name = String(value).trim();
                                } else if (key.includes('fecha') || key.includes('date') || colIndex === 1) {
                                    event.date = formatDate(value);
                                    event.day = getDayOfWeek(value);
                                } else if (key.includes('hora') || key.includes('time') || colIndex === 2) {
                                    event.time = String(value).trim();
                                } else if (key.includes('lugar') || key.includes('venue') || key.includes('artista') || colIndex === 3) {
                                    event.venue = String(value).trim();
                                } else if (key.includes('categoria') || key.includes('category') || key.includes('tipo') || colIndex === 4) {
                                    event.category = String(value).trim();
                                }
                            });
                            
                            return {
                                id: index + 1,
                                name: event.name || `Evento ${index + 1}`,
                                date: event.date || '',
                                time: event.time || '',
                                venue: event.venue || '',
                                category: event.category || 'EVENTO',
                                day: event.day || ''
                            };
                        }).filter(event => event.name && event.name.trim() !== '' && event.name !== `Evento ${event.id}`);
                        
                        setEvents(eventsData);
                        setLoading(false);
                        
                    } catch (err) {
                        console.error('Error cargando eventos:', err);
                        setError(err.message);
                        setLoading(false);
                    }
                };

                loadEventsFromExcel();
            }, []);

            // Calcular posiciones de eventos con mejor centrado vertical
            useEffect(() => {
                if (tagsContainerRef.current && events.length > 0) {
                    const container = tagsContainerRef.current;
                    const eventElements = container.querySelectorAll('.event-text');
                    const positions = Array.from(eventElements).map((element, index) => {
                        const rect = element.getBoundingClientRect();
                        const containerRect = container.getBoundingClientRect();
                        
                        const textCenterY = rect.top - containerRect.top + (rect.height / 2) - 7;
                        
                        return {
                            id: events[index].id,
                            x: rect.left - containerRect.left,
                            y: textCenterY,
                            width: rect.width,
                            height: rect.height
                        };
                    });
                    setEventPositions(positions);
                }
            }, [events]);

            // Calcular ancho del carrusel dinámicamente
            const carouselWidth = events.length > 0 ? (events.length * 100) : 1400;
            const slideWidth = events.length > 0 ? (100 / events.length) : 7.14;

            // Inicializar primer evento - versión mejorada
            useEffect(() => {
                if (events.length > 0) {
                    const firstEvent = events[0];
                    setSelectedEvent(firstEvent.id);
                    setBrutalistEventData(firstEvent);
                    setCurrentEventIndex(0);
                    setCarouselOffset(0);
                    setShowBrutalistInfo(true);
                    
                    // Esperar un momento para que se rendericen los elementos
                    setTimeout(() => {
                        if (eventPositions.length > 0) {
                            const firstPosition = eventPositions[0];
                            const firstWidth = getEventWidth(0);
                            if (firstPosition) {
                                setTagPosition({ x: firstPosition.x, y: firstPosition.y });
                                setTagWidth(firstWidth);
                                setIsTagVisible(true);
                            }
                        }
                    }, 100);
                }
            }, [events, eventPositions]);

            // Obtener ancho del evento
            const getEventWidth = (eventIndex) => {
                if (tagsContainerRef.current) {
                    const eventElement = tagsContainerRef.current.querySelectorAll('.event-text')[eventIndex];
                    if (eventElement) {
                        return eventElement.offsetWidth;
                    }
                }
                return 60;
            };

            // Detectar cambio de línea con mayor precisión para mobile
            const isLineBreak = (fromIndex, toIndex) => {
                if (!eventPositions[fromIndex] || !eventPositions[toIndex]) return false;
                
                const fromY = eventPositions[fromIndex].y;
                const toY = eventPositions[toIndex].y;
                const yDifference = Math.abs(toY - fromY);
                
                return yDifference > 8;
            };

            // Detectar si estamos en el último elemento de una línea
            const isLastInLine = (eventIndex) => {
                if (eventIndex >= events.length - 1) return true;
                
                const currentY = eventPositions[eventIndex]?.y;
                const nextY = eventPositions[eventIndex + 1]?.y;
                
                if (!currentY || !nextY) return false;
                
                return Math.abs(nextY - currentY) > 8;
            };

            // Detectar si estamos en el primer elemento de una línea
            const isFirstInLine = (eventIndex) => {
                if (eventIndex === 0) return true;
                
                const currentY = eventPositions[eventIndex]?.y;
                const prevY = eventPositions[eventIndex - 1]?.y;
                
                if (!currentY || !prevY) return false;
                
                return Math.abs(currentY - prevY) > 8;
            };

            // Solución simple: desaparecer y aparecer para cambios de línea
            const moveTagToEvent = (eventIndex) => {
                if (eventPositions[eventIndex]) {
                    const position = eventPositions[eventIndex];
                    const width = getEventWidth(eventIndex);
                    
                    const hasLineBreak = isLineBreak(currentEventIndex, eventIndex);
                    const isFromLastInLine = isLastInLine(currentEventIndex);
                    const isToFirstInLine = isFirstInLine(eventIndex);
                    
                    const tagElement = document.querySelector('.sliding-tag');
                    
                    if (hasLineBreak && isFromLastInLine && isToFirstInLine) {
                        if (tagElement) {
                            tagElement.className = 'sliding-tag fade-out';
                        }
                        setIsTagVisible(false);
                        
                        setTimeout(() => {
                            setTagPosition({ x: position.x, y: position.y });
                            setTagWidth(width);
                            
                            setTimeout(() => {
                                if (tagElement) {
                                    tagElement.className = 'sliding-tag fade-in';
                                }
                                setIsTagVisible(true);
                                setIsDraggingTag(false);
                            }, 50);
                        }, 300);
                        
                    } else {
                        if (tagElement) {
                            tagElement.className = 'sliding-tag smooth-horizontal';
                        }
                        
                        setTagPosition({ x: position.x, y: position.y });
                        setTagWidth(width);
                        setIsTagVisible(true);
                        setIsDraggingTag(false);
                    }
                }
            };

            // Mover carrusel
            const moveCarousel = (index) => {
                const offset = -index * slideWidth;
                setCarouselOffset(offset);
                setIsDraggingCarousel(false);
            };

            // Animar transición
            const animateEventTransition = (newEvent, newIndex) => {
                moveTagToEvent(newIndex);
                moveCarousel(newIndex);
                setSelectedEvent(newEvent.id);
                setBrutalistEventData(newEvent);
            };

            // Funciones de swipe (mantienen la misma lógica)
            const handleTouchStart = (e) => {
                setStartX(e.touches[0].clientX);
                setStartY(e.touches[0].clientY);
                setIsSwipping(true);
                setIsDraggingTag(true);
                setIsDraggingCarousel(true);
            };

            const handleTouchMove = (e) => {
                if (!isSwipping || events.length === 0) return;
                
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const diffX = startX - currentX;
                const diffY = startY - currentY;
                
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 5) {
                    e.preventDefault();
                    
                    const deadZone = 15;
                    const effectiveDiff = Math.abs(diffX) < deadZone ? 0 : diffX - (deadZone * Math.sign(diffX));
                    
                    const rawProgress = effectiveDiff / 140;
                    const physicsProgress = Math.tanh(rawProgress) * 0.8;
                    
                    if (eventPositions.length > 0) {
                        const direction = diffX > 0 ? 1 : -1;
                        const currentPos = eventPositions[currentEventIndex];
                        let targetIndex = currentEventIndex + direction;
                        
                        if (targetIndex >= events.length) targetIndex = 0;
                        if (targetIndex < 0) targetIndex = events.length - 1;
                        
                        const targetPos = eventPositions[targetIndex];
                        const currentWidth = getEventWidth(currentEventIndex);
                        const targetWidth = getEventWidth(targetIndex);
                        
                        if (currentPos && targetPos) {
                            const progressAbs = Math.min(Math.abs(physicsProgress), 1);
                            const smoothProgress = progressAbs * progressAbs * (3 - 2 * progressAbs);
                            
                            const interpolatedPos = {
                                x: currentPos.x + (targetPos.x - currentPos.x) * smoothProgress,
                                y: currentPos.y + (targetPos.y - currentPos.y) * smoothProgress
                            };
                            
                            const interpolatedWidth = currentWidth + (targetWidth - currentWidth) * smoothProgress;
                            
                            setTagPosition(interpolatedPos);
                            setTagWidth(interpolatedWidth);
                        }
                    }
                    
                    const baseOffset = -currentEventIndex * slideWidth;
                    const carouselEffectiveDiff = Math.abs(diffX) < deadZone ? 0 : diffX - (deadZone * Math.sign(diffX));
                    const carouselPhysicsProgress = Math.tanh(carouselEffectiveDiff / 140) * 0.8;
                    const dragOffset = carouselPhysicsProgress * slideWidth;
                    setCarouselOffset(baseOffset - dragOffset);
                }
            };

            const handleTouchEnd = (e) => {
                if (!isSwipping || events.length === 0) return;
                
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;
                
                setIsSwipping(false);
                setIsDraggingTag(false);
                setIsDraggingCarousel(false);
                
                if (Math.abs(diffX) > 45) {
                    if (diffX > 0) {
                        handleArrowDown();
                    } else {
                        handleArrowUp();
                    }
                } else {
                    moveTagToEvent(currentEventIndex);
                    moveCarousel(currentEventIndex);
                }
            };

            const handleMouseStart = (e) => {
                setStartX(e.clientX);
                setStartY(e.clientY);
                setIsSwipping(true);
                setIsDraggingTag(true);
                setIsDraggingCarousel(true);
            };

            const handleMouseMove = (e) => {
                if (!isSwipping || events.length === 0) return;
                
                const currentX = e.clientX;
                const diffX = startX - currentX;
                const diffY = startY - e.clientY;
                
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 5) {
                    e.preventDefault();
                    
                    const deadZone = 15;
                    const effectiveDiff = Math.abs(diffX) < deadZone ? 0 : diffX - (deadZone * Math.sign(diffX));
                    
                    const rawProgress = effectiveDiff / 140;
                    const physicsProgress = Math.tanh(rawProgress) * 0.8;
                    
                    if (eventPositions.length > 0) {
                        const direction = diffX > 0 ? 1 : -1;
                        const currentPos = eventPositions[currentEventIndex];
                        let targetIndex = currentEventIndex + direction;
                        
                        if (targetIndex >= events.length) targetIndex = 0;
                        if (targetIndex < 0) targetIndex = events.length - 1;
                        
                        const targetPos = eventPositions[targetIndex];
                        const currentWidth = getEventWidth(currentEventIndex);
                        const targetWidth = getEventWidth(targetIndex);
                        
                        if (currentPos && targetPos) {
                            const progressAbs = Math.min(Math.abs(physicsProgress), 1);
                            const smoothProgress = progressAbs * progressAbs * (3 - 2 * progressAbs);
                            
                            const interpolatedPos = {
                                x: currentPos.x + (targetPos.x - currentPos.x) * smoothProgress,
                                y: currentPos.y + (targetPos.y - currentPos.y) * smoothProgress
                            };
                            
                            const interpolatedWidth = currentWidth + (targetWidth - currentWidth) * smoothProgress;
                            
                            setTagPosition(interpolatedPos);
                            setTagWidth(interpolatedWidth);
                        }
                    }
                    
                    const baseOffset = -currentEventIndex * slideWidth;
                    const carouselEffectiveDiff = Math.abs(diffX) < deadZone ? 0 : diffX - (deadZone * Math.sign(diffX));
                    const carouselPhysicsProgress = Math.tanh(carouselEffectiveDiff / 140) * 0.8;
                    const dragOffset = carouselPhysicsProgress * slideWidth;
                    setCarouselOffset(baseOffset - dragOffset);
                }
            };

            const handleMouseEnd = (e) => {
                if (!isSwipping || events.length === 0) return;
                
                const endX = e.clientX;
                const diffX = startX - endX;
                
                setIsSwipping(false);
                setIsDraggingTag(false);
                setIsDraggingCarousel(false);
                
                if (Math.abs(diffX) > 45) {
                    if (diffX > 0) {
                        handleArrowDown();
                    } else {
                        handleArrowUp();
                    }
                } else {
                    moveTagToEvent(currentEventIndex);
                    moveCarousel(currentEventIndex);
                }
            };

            const handleArrowDown = () => {
                if (events.length === 0) return;
                const nextIndex = (currentEventIndex + 1) % events.length;
                setCurrentEventIndex(nextIndex);
                const nextEvent = events[nextIndex];
                animateEventTransition(nextEvent, nextIndex);
            };

            const handleArrowUp = () => {
                if (events.length === 0) return;
                const prevIndex = currentEventIndex === 0 ? events.length - 1 : currentEventIndex - 1;
                setCurrentEventIndex(prevIndex);
                const prevEvent = events[prevIndex];
                animateEventTransition(prevEvent, prevIndex);
            };

            const handleEventTagClick = (event) => {
                const eventIndex = events.findIndex(e => e.id === event.id);
                setCurrentEventIndex(eventIndex);
                animateEventTransition(event, eventIndex);
                setShowBrutalistInfo(true);
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-black overflow-hidden flex items-center justify-center" style={{ fontFamily: 'Space Mono, monospace' }}>
                        <div className="loading-message">
                            Cargando eventos...
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="min-h-screen bg-black overflow-hidden flex items-center justify-center" style={{ fontFamily: 'Space Mono, monospace' }}>
                        <div className="loading-message">
                            Error: {error}
                            <br />
                            <small>Asegúrate de que el archivo "Eventos.xlsx" esté en la misma carpeta</small>
                        </div>
                    </div>

            return (

                    <div style={{

                            <path d="M394.951 114.713C373.073 137.843 345.914 145.245 334.29 131.244C322.666 117.243 330.979 87.1425 352.858 64.0122C374.736 40.882 401.895 33.4808 413.519 47.4813C425.143 61.4822 416.83 91.583 394.951 114.713ZM343.722 121.849C353.628 133.781 375.498 128.823 392.57 110.774C409.641 92.7261 415.45 68.4226 405.544 56.4907C395.637 44.5588 373.768 49.5167 356.696 67.565C339.624 85.6133 333.816 109.917 343.722 121.849Z" fill="currentColor"/>

                            <path d="M155.527 75.2973C181.002 69.1841 204.228 75.2448 207.405 88.8338C210.581 102.423 192.503 118.395 167.028 124.508C141.553 130.622 118.327 124.562 115.15 110.973C111.974 97.3834 130.052 81.4106 155.527 75.2973ZM196.65 91.1002C193.943 79.5191 175.635 73.9979 155.757 78.7679C135.879 83.5381 121.958 96.7929 124.665 108.374C127.371 119.955 145.68 125.477 165.559 120.706C185.436 115.936 199.356 102.681 196.65 91.1002Z" fill="currentColor"/>

                            <path d="M252.669 76.3667C258.782 101.842 252.722 125.068 239.133 128.244C225.543 131.42 209.572 113.343 203.458 87.8675C197.345 62.3923 203.405 39.1662 216.994 35.9898C230.583 32.8139 246.556 50.8912 252.669 76.3667ZM236.866 117.489C248.447 114.783 253.969 96.4745 249.199 76.5964C244.428 56.7183 231.174 42.7978 219.593 45.5042C208.011 48.2109 202.49 66.5199 207.26 86.3981C212.03 106.276 225.285 120.196 236.866 117.489Z" fill="currentColor"/>
                            <path d="M376.616 101.351L362.125 97.4176L354.909 105.537L346.065 103.136L380.323 65.4031L395.629 69.558L381.758 112.825L373.54 110.595L376.616 101.351ZM368.139 90.584L379.179 93.581L386.505 71.5157L385.376 71.2092L368.139 90.584Z" fill="currentColor"/>
                            <path d="M165.461 107.154L155.132 108.316L153.024 115.346L146.719 116.055L156.97 83.203L167.881 81.9753L172.164 113.192L166.306 113.851L165.461 107.154ZM156.868 102.415L164.738 101.529L162.713 85.5456L161.908 85.6362L156.868 102.415Z" fill="currentColor"/>
                            <path d="M287.72 87.7026L279.04 96.1966L274.132 92.9306L297.129 70.3967L306.494 76.6295C307.593 77.3608 308.463 78.1922 309.105 79.1235C309.771 80.0715 310.209 81.0655 310.418 82.1054C310.626 83.1453 310.611 84.1978 310.37 85.263C310.155 86.3449 309.715 87.3853 309.05 88.3843C308.119 89.7829 307.034 90.8987 305.795 91.7318C304.556 92.5648 303.225 93.1026 301.802 93.345C300.38 93.5875 298.907 93.5263 297.384 93.1614C295.861 92.7965 294.35 92.1155 292.852 91.1182L287.72 87.7026ZM291.872 83.6555L296.443 86.6971C297.717 87.5448 299.027 87.8765 300.375 87.6924C301.723 87.5083 302.796 86.8168 303.593 85.618C304.208 84.6939 304.374 83.7952 304.091 82.9217C303.848 82.04 303.253 81.2833 302.304 80.6517L297.921 77.7347L291.872 83.6555Z" fill="currentColor"/>
                            <path d="M212.485 72.3721L223.6 68.5005L229.151 95.8042L229.967 102.159L231.213 101.725L230.393 95.0222L228.69 66.7274L240.117 62.7472L245.043 101.8L239.121 103.863L235.889 78.1978L235.404 69.2811L234.158 69.7153L236.005 104.948L226.708 108.187L219.667 74.763L218.42 75.1972L220.095 83.3499L223.332 109.363L217.463 111.407L212.485 72.3721Z" fill="currentColor"/>
                        </svg>
                    </div>

                    {/* Sección de Eventos */}
                    <div className="contributors-section">
                        <div className="contributors-tags" ref={tagsContainerRef}>
                            {/* Etiqueta deslizante con physics */}
                            {selectedEvent && eventPositions.length > 0 && isTagVisible && (
                                <div 
                                    className={`sliding-tag ${isDraggingTag ? 'dragging' : ''}`}
                                    style={{
                                        left: `${tagPosition.x}px`,
                                        top: `${tagPosition.y}px`,
                                        width: `${tagWidth}px`
                                    }}
                                />
                            )}

                            {events.map((event, index) => (
                                <div key={event.id} className="event-wrapper">
                                    <span 
                                        className={`event-text ${selectedEvent === event.id ? 'has-tag' : ''}`}
                                        onClick={() => handleEventTagClick(event)}
                                        title={`${event.date} - ${event.time} - ${event.venue}`}
                                    >
                                        {event.name}
                                        {eventLikes[event.id] > 0 && (
                                            <span className="event-likes-display">
                                                +{eventLikes[event.id]}
                                            </span>
                                        )}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Overlay principal */}
                    <div 
                        className={`brutalist-overlay ${showBrutalistInfo ? 'show' : ''}`}
                        ref={overlayRef}
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                        onTouchEnd={handleTouchEnd}
                        onMouseDown={handleMouseStart}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseEnd}
                        onMouseLeave={handleMouseEnd}
                        style={{ userSelect: 'none', touchAction: 'pan-x' }}
                    >
                        {brutalistEventData && (
                            <div className="event-content">
                                <div 
                                    className={`event-carousel ${isDraggingCarousel ? 'dragging' : ''}`}
                                    style={{
                                        transform: `translateX(${carouselOffset}%)`,
                                        width: `${carouselWidth}%`
                                    }}
                                >
                                    {events.map((event, index) => (
                                        <div key={event.id} className="event-slide" style={{ width: `${slideWidth}%` }}>
                                            <div className="date-line">
                                                <div className="day-circle">
                                                    <div className="brutalist-text day day-text">{event.day}</div>
                                                </div>
                                                <div className="brutalist-text date">{event.date.replace(/\./g, '-')}</div>
                                                <div className="day-circle">
                                                    <div className="brutalist-text day day-text">{event.day}</div>
                                                </div>
                                            </div>
                                            
                                            <div className="brutalist-text eventname">{event.name}</div>
                                            
                                            {event.venue && event.venue !== event.name && (
                                                <div className="brutalist-text time-label venue-text">{event.venue}</div>
                                            )}
                                            
                                            <div className="brutalist-text time-label">{event.time}H</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Botón de validación flotante con SVG personalizado */}
                    {brutalistEventData && (
                        <button 
                            className={`like-button ${userLikes.has(brutalistEventData.id) ? 'liked' : ''}`}
                            onClick={() => handleLikeEvent(brutalistEventData.id)}
                            title={userLikes.has(brutalistEventData.id) ? 'Quitar validación' : 'Validar evento'}
                        >
                            <svg width="50" height="50" viewBox="0 0 260 273" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <g clipPath="url(#clip0_1549_5630)">

                                    <path d="M211.5 136.021C211.5 140.716 207.695 144.521 203 144.521L150.5 144.521C143.873 144.521 138.5 149.893 138.5 156.521V209.021C138.5 213.715 134.695 217.521 130 217.521C125.306 217.521 121.5 213.715 121.499 209.021V156.521C121.5 149.893 116.128 144.521 109.501 144.521L56.9997 144.521C52.3057 144.521 48.5001 140.715 48.4997 136.021C48.5001 131.326 52.3057 127.521 56.9999 127.521L109.5 127.521C116.128 127.52 121.5 122.148 121.5 115.521L121.5 63.0208C121.5 58.3264 125.306 54.5209 130 54.5209C134.694 54.5209 138.5 58.3264 138.5 63.0209L138.5 115.521C138.5 122.149 143.872 127.521 150.5 127.52L203 127.521C207.695 127.521 211.5 131.327 211.5 136.021Z" fill="#FF0000"/>

                    </div>
                </div>

        };

    </script>
