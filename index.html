<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTOS</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&family=Inter:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=new-title@400,700&display=swap" rel="stylesheet">
    <style>
        .brutalist-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 995;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
            padding: -4px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Contenedor de evento con carousel */
        .event-content {
            position: relative;
            width: 100vw;
            overflow: hidden;
            margin-left: -20px;
            margin-right: -20px;
            margin-top: -60px;
        }

        .event-carousel {
            display: flex;
            transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
            width: 1400%;
            will-change: transform;
        }

        .event-carousel.dragging {
            transition: none;
        }

        .event-slide {
            width: 7.14%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .brutalist-text {
            font-family: 'Bebas Neue', sans-serif;
            font-weight: 400;
            color: #B8B0A3;
            text-align: center;
            filter: blur(0.3px);
            padding: 0;
            margin: 0;
            line-height: 0.85;
            letter-spacing: -0.06em;
        }

        /* TAMAÑOS REDUCIDOS 10% PARA EL AFICHE */
        .event-slide .brutalist-text.day {
            font-size: 21px !important;
            margin-bottom: 4px;
        }

        .event-slide .brutalist-text.date {
            font-family: 'New Title', 'Bebas Neue', sans-serif !important;
            font-size: 75px !important;
            font-weight: 700 !important;
            margin-bottom: 4px;
            line-height: 0.75;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .date-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 4px;
        }

        .event-slide .day-circle {
            width: 72px !important;
            height: 72px !important;
            border: 2px solid #B8B0A3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scaleY(0.6);
            position: relative;
        }

        .day-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scaleY(1.67);
            filter: blur(0.2px);
        }

        .event-slide .brutalist-text.eventname {
            font-family: 'New Title', 'Bebas Neue', sans-serif !important;
            font-size: 116px !important;
            font-weight: 700 !important;
            margin-bottom: 4px;
            line-height: 0.85;
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }

        .event-slide .brutalist-text.time-label {
            font-size: 31px !important;
            margin-bottom: 2px;
        }

        .event-slide .brutalist-text.venue-text {
            font-size: 35px !important;
            padding-top: 5px !important;
        }

        .logo-section {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 998;
            pointer-events: none;
        }

        .rampa-logo {
            width: 120px;
            height: auto;
            color: #B8B0A3;
            filter: blur(0.3px);
        }

        .contributors-section {
            position: fixed;
            bottom: 60px; /* Reduced from 80px to 60px */
            left: 10px;
            right: 10px;
            z-index: 998;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 300;
            color: #B8B0A3;
            line-height: 1.0;
            letter-spacing: 0.01em;
            pointer-events: none;
            margin-top: 98px;
        }

        .contributors-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            margin-bottom: 8px; /* Reduced from 16px to 8px */
            position: relative;
            pointer-events: auto;
            justify-content: center;
        }

        .event-wrapper {
            position: relative;
            display: inline-block;
            margin: 0;
            pointer-events: auto;
        }

        .sliding-tag {
            position: absolute;
            background: #B8B0A3;
            border: none;
            border-radius: 12px;
            padding: 2px 4px;
            font-size: 10px;
            font-weight: 300;
            color: black;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
            filter: blur(0.3px);
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 1;
            min-width: 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 14px;
            transform: translateY(-1px);
            will-change: transform, width, opacity, left, top;
        }

        .sliding-tag.dragging {
            transition: none;
        }

        .sliding-tag.smooth-horizontal {
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sliding-tag.fade-out {
            transition: opacity 0.3s ease-out;
            opacity: 0;
        }

        .sliding-tag.fade-in {
            transition: opacity 0.4s ease-in;
            opacity: 1;
        }

        .event-text {
            color: #B8B0A3;
            font-size: 10px;
            font-weight: 300;
            padding: 2px 4px;
            cursor: pointer;
            transition: color 0.4s ease, opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            white-space: nowrap;
            display: inline-block;
            margin: 0;
            letter-spacing: 0.01em;
            pointer-events: auto;
            position: relative;
            z-index: 10;
            filter: blur(0.3px);
            line-height: 1.0;
            box-sizing: border-box;
        }

        .event-text:hover {
            color: #D4CFC2;
        }

        .event-text.has-tag {
            color: black;
        }

        .final-bottom-buttons {
            position: fixed;
            bottom: 50px;
            left: 20px;
            right: 20px;
            display: none; /* Hidden the plus button section */
            justify-content: center;
            gap: 15px;
            z-index: 999;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 300;
            pointer-events: auto;
        }

        .final-button-tag {
            color: #B8B0A3;
            font-size: 10px;
            font-weight: 300;
            padding: 2px 4px;
            cursor: pointer;
            transition: color 0.4s ease, opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            white-space: nowrap;
            display: inline-block;
            margin: 0;
            letter-spacing: 0.01em;
            pointer-events: auto;
            position: relative;
            z-index: 10;
            filter: blur(0.3px);
            line-height: 1.0;
            box-sizing: border-box;
            background: transparent;
            border: none;
            border-radius: 0;
        }

        .final-button-tag:hover {
            color: #D4CFC2;
            background: transparent;
            transform: none;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const MSCHFEventsBillboard = () => {
            const [selectedEvent, setSelectedEvent] = useState(null);
            const [showBrutalistInfo, setShowBrutalistInfo] = useState(true);
            const [brutalistEventData, setBrutalistEventData] = useState(null);
            const [currentEventIndex, setCurrentEventIndex] = useState(0);
            
            // Estados para swipe
            const [startX, setStartX] = useState(0);
            const [startY, setStartY] = useState(0);
            const [isSwipping, setIsSwipping] = useState(false);
            const overlayRef = useRef(null);
            
            // Estados para carrusel
            const [carouselOffset, setCarouselOffset] = useState(0);
            const [isDraggingCarousel, setIsDraggingCarousel] = useState(false);

            // Estados para etiqueta con physics
            const [tagPosition, setTagPosition] = useState({ x: 0, y: 0 });
            const [tagWidth, setTagWidth] = useState(60);
            const [isDraggingTag, setIsDraggingTag] = useState(false);
            const [eventPositions, setEventPositions] = useState([]);
            const [isTagVisible, setIsTagVisible] = useState(true);
            const tagsContainerRef = useRef(null);

            const events = [
                { id: 1, name: "Phonoteque", date: "17.08.25", time: "23:00", venue: "FLHEZ, FEFIO, NICOLÁS ARIN B2B STONEM", category: "RAVE", day: "DOMINGO" },
                { id: 2, name: "Quebrada Festival", date: "22.08.25", time: "20:00", venue: "NICOLÁS JAAR, ANTHEA, LUCIANO SUPERVIELLE", category: "FESTIVAL", day: "VIERNES" },
                { id: 3, name: "Baum Sessions", date: "23.08.25", time: "22:00", venue: "KLANGKUENSTLER, ÂVALL", category: "RAVE", day: "SÁBADO" },
                { id: 4, name: "No Sleep Club", date: "24.08.25", time: "23:00", venue: "DANNY AVILA, LOCAL RESIDENTS", category: "CLUB", day: "DOMINGO" },
                { id: 5, name: "Underworld MVD", date: "29.08.25", time: "23:30", venue: "BEN KLOCK, MARCEL DETTMANN", category: "RAVE", day: "VIERNES" },
                { id: 6, name: "Electric Park", date: "30.08.25", time: "18:00", venue: "CHARLOTTE DE WITTE, AMELIE LENS", category: "FESTIVAL", day: "SÁBADO" },
                { id: 7, name: "Mute Night", date: "05.09.25", time: "23:00", venue: "TALE OF US, MIND AGAINST", category: "RAVE", day: "VIERNES" },
                { id: 8, name: "Cosmic Rave", date: "06.09.25", time: "22:30", venue: "MACEO PLEX, JORIS VOORN", category: "RAVE", day: "SÁBADO" },
                { id: 9, name: "Fabric Montevideo", date: "12.09.25", time: "23:00", venue: "CRAIG RICHARDS, TERRY FRANCIS", category: "CLUB", day: "VIERNES" },
                { id: 10, name: "Circoloco MVD", date: "13.09.25", time: "16:00", venue: "DIXON, ÂMEELIE LENS", category: "FESTIVAL", day: "SÁBADO" },
                { id: 11, name: "Berghain Tribute", date: "19.09.25", time: "23:30", venue: "RØDHÅD, ANSWER CODE REQUEST", category: "RAVE", day: "VIERNES" },
                { id: 12, name: "Afterlife MVD", date: "20.09.25", time: "21:00", venue: "MATHAME, KEVIN DE VRIES", category: "RAVE", day: "SÁBADO" },
                { id: 13, name: "Tresor Night", date: "26.09.25", time: "23:00", venue: "JEFF MILLS, ROBERT HOOD", category: "RAVE", day: "VIERNES" },
                { id: 14, name: "Sunwaves UY", date: "27.09.25", time: "12:00", venue: "RICARDO VILLALOBOS, RARESH", category: "FESTIVAL", day: "SÁBADO" }
            ];

            // Calcular posiciones de eventos con mejor centrado vertical
            useEffect(() => {
                if (tagsContainerRef.current) {
                    const container = tagsContainerRef.current;
                    const eventElements = container.querySelectorAll('.event-text');
                    const positions = Array.from(eventElements).map((element, index) => {
                        const rect = element.getBoundingClientRect();
                        const containerRect = container.getBoundingClientRect();
                        
                        // Mejor centrado vertical: centro exacto del texto menos la mitad de la altura de la etiqueta
                        const textCenterY = rect.top - containerRect.top + (rect.height / 2) - 7;
                        
                        return {
                            id: events[index].id,
                            x: rect.left - containerRect.left,
                            y: textCenterY,
                            width: rect.width,
                            height: rect.height
                        };
                    });
                    setEventPositions(positions);
                }
            }, []);

            // Inicializar primer evento
            useEffect(() => {
                if (events.length > 0 && eventPositions.length > 0) {
                    const firstEvent = events[0];
                    setSelectedEvent(firstEvent.id);
                    setBrutalistEventData(firstEvent);
                    setCurrentEventIndex(0);
                    setCarouselOffset(0);
                    
                    const firstPosition = eventPositions[0];
                    const firstWidth = getEventWidth(0);
                    if (firstPosition) {
                        setTagPosition({ x: firstPosition.x, y: firstPosition.y });
                        setTagWidth(firstWidth);
                        setIsTagVisible(true);
                    }
                }
            }, [eventPositions]);

            // Obtener ancho del evento
            const getEventWidth = (eventIndex) => {
                if (tagsContainerRef.current) {
                    const eventElement = tagsContainerRef.current.querySelectorAll('.event-text')[eventIndex];
                    if (eventElement) {
                        return eventElement.offsetWidth;
                    }
                }
                return 60;
            };

            // Detectar cambio de línea con mayor precisión para mobile
            const isLineBreak = (fromIndex, toIndex) => {
                if (!eventPositions[fromIndex] || !eventPositions[toIndex]) return false;
                
                const fromY = eventPositions[fromIndex].y;
                const toY = eventPositions[toIndex].y;
                const yDifference = Math.abs(toY - fromY);
                
                // En mobile, si la diferencia Y es mayor a 8px, consideramos cambio de línea
                return yDifference > 8;
            };

            // Detectar si estamos en el último elemento de una línea
            const isLastInLine = (eventIndex) => {
                if (eventIndex >= events.length - 1) return true; // Último evento general
                
                const currentY = eventPositions[eventIndex]?.y;
                const nextY = eventPositions[eventIndex + 1]?.y;
                
                if (!currentY || !nextY) return false;
                
                // Si el siguiente evento está en una línea diferente, este es el último de su línea
                return Math.abs(nextY - currentY) > 8;
            };

            // Detectar si estamos en el primer elemento de una línea
            const isFirstInLine = (eventIndex) => {
                if (eventIndex === 0) return true; // Primer evento general
                
                const currentY = eventPositions[eventIndex]?.y;
                const prevY = eventPositions[eventIndex - 1]?.y;
                
                if (!currentY || !prevY) return false;
                
                // Si el evento anterior está en una línea diferente, este es el primero de su línea
                return Math.abs(currentY - prevY) > 8;
            };

            // Solución simple: desaparecer y aparecer para cambios de línea
            const moveTagToEvent = (eventIndex) => {
                if (eventPositions[eventIndex]) {
                    const position = eventPositions[eventIndex];
                    const width = getEventWidth(eventIndex);
                    
                    const hasLineBreak = isLineBreak(currentEventIndex, eventIndex);
                    const isFromLastInLine = isLastInLine(currentEventIndex);
                    const isToFirstInLine = isFirstInLine(eventIndex);
                    
                    // Obtener el elemento de la etiqueta
                    const tagElement = document.querySelector('.sliding-tag');
                    
                    // Caso específico: último de línea → primero de siguiente línea
                    if (hasLineBreak && isFromLastInLine && isToFirstInLine) {
                        // Fase 1: Desaparecer
                        if (tagElement) {
                            tagElement.className = 'sliding-tag fade-out';
                        }
                        setIsTagVisible(false);
                        
                        // Fase 2: Reposicionar invisiblemente y aparecer
                        setTimeout(() => {
                            setTagPosition({ x: position.x, y: position.y });
                            setTagWidth(width);
                            
                            setTimeout(() => {
                                if (tagElement) {
                                    tagElement.className = 'sliding-tag fade-in';
                                }
                                setIsTagVisible(true);
                                setIsDraggingTag(false);
                            }, 50);
                        }, 300);
                        
                    } else {
                        // Movimiento horizontal normal o cambios de línea simples
                        if (tagElement) {
                            tagElement.className = 'sliding-tag smooth-horizontal';
                        }
                        
                        setTagPosition({ x: position.x, y: position.y });
                        setTagWidth(width);
                        setIsTagVisible(true);
                        setIsDraggingTag(false);
                    }
                }
            };

            // Mover carrusel
            const moveCarousel = (index) => {
                const offset = -index * 7.14;
                setCarouselOffset(offset);
                setIsDraggingCarousel(false);
            };

            // Animar transición
            const animateEventTransition = (newEvent, newIndex) => {
                moveTagToEvent(newIndex);
                moveCarousel(newIndex);
                setSelectedEvent(newEvent.id);
                setBrutalistEventData(newEvent);
            };

            // Funciones de swipe
            const handleTouchStart = (e) => {
                setStartX(e.touches[0].clientX);
                setStartY(e.touches[0].clientY);
                setIsSwipping(true);
                setIsDraggingTag(true);
                setIsDraggingCarousel(true);
            };

            const handleTouchMove = (e) => {
                if (!isSwipping) return;
                
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const diffX = startX - currentX;
                const diffY = startY - currentY;
                
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 5) {
                    e.preventDefault();
                    
                    const deadZone = 15;
                    const effectiveDiff = Math.abs(diffX) < deadZone ? 0 : diffX - (deadZone * Math.sign(diffX));
                    
                    const rawProgress = effectiveDiff / 140;
                    const physicsProgress = Math.tanh(rawProgress) * 0.8;
                    
                    if (eventPositions.length > 0) {
                        const direction = diffX > 0 ? 1 : -1;
                        const currentPos = eventPositions[currentEventIndex];
                        let targetIndex = currentEventIndex + direction;
                        
                        if (targetIndex >= events.length) targetIndex = 0;
                        if (targetIndex < 0) targetIndex = events.length - 1;
                        
                        const targetPos = eventPositions[targetIndex];
                        const currentWidth = getEventWidth(currentEventIndex);
                        const targetWidth = getEventWidth(targetIndex);
                        
                        if (currentPos && targetPos) {
                            const progressAbs = Math.min(Math.abs(physicsProgress), 1);
                            const smoothProgress = progressAbs * progressAbs * (3 - 2 * progressAbs);
                            
                            // Interpolación directa y suave para todos los casos
                            const interpolatedPos = {
                                x: currentPos.x + (targetPos.x - currentPos.x) * smoothProgress,
                                y: currentPos.y + (targetPos.y - currentPos.y) * smoothProgress
                            };
                            
                            const interpolatedWidth = currentWidth + (targetWidth - currentWidth) * smoothProgress;
                            
                            setTagPosition(interpolatedPos);
                            setTagWidth(interpolatedWidth);
                        }
                    }
                    
                    // Carousel con la misma física exacta
                    const baseOffset = -currentEventIndex * 7.14;
                    const carouselEffectiveDiff = Math.abs(diffX) < deadZone ? 0 : diffX - (deadZone * Math.sign(diffX));
                    const carouselPhysicsProgress = Math.tanh(carouselEffectiveDiff / 140) * 0.8;
                    const dragOffset = carouselPhysicsProgress * 7.14;
                    setCarouselOffset(baseOffset - dragOffset);
                }
            };

            const handleTouchEnd = (e) => {
                if (!isSwipping) return;
                
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;
                
                setIsSwipping(false);
                setIsDraggingTag(false);
                setIsDraggingCarousel(false);
                
                if (Math.abs(diffX) > 45) {
                    if (diffX > 0) {
                        handleArrowDown();
                    } else {
                        handleArrowUp();
                    }
                } else {
                    moveTagToEvent(currentEventIndex);
                    moveCarousel(currentEventIndex);
                }
            };

            const handleMouseStart = (e) => {
                setStartX(e.clientX);
                setStartY(e.clientY);
                setIsSwipping(true);
                setIsDraggingTag(true);
                setIsDraggingCarousel(true);
            };

            const handleMouseMove = (e) => {
                if (!isSwipping) return;
                
                const currentX = e.clientX;
                const diffX = startX - currentX;
                const diffY = startY - e.clientY;
                
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 5) {
                    e.preventDefault();
                    
                    const deadZone = 15;
                    const effectiveDiff = Math.abs(diffX) < deadZone ? 0 : diffX - (deadZone * Math.sign(diffX));
                    
                    const rawProgress = effectiveDiff / 140;
                    const physicsProgress = Math.tanh(rawProgress) * 0.8;
                    
                    if (eventPositions.length > 0) {
                        const direction = diffX > 0 ? 1 : -1;
                        const currentPos = eventPositions[currentEventIndex];
                        let targetIndex = currentEventIndex + direction;
                        
                        if (targetIndex >= events.length) targetIndex = 0;
                        if (targetIndex < 0) targetIndex = events.length - 1;
                        
                        const targetPos = eventPositions[targetIndex];
                        const currentWidth = getEventWidth(currentEventIndex);
                        const targetWidth = getEventWidth(targetIndex);
                        
                        if (currentPos && targetPos) {
                            const progressAbs = Math.min(Math.abs(physicsProgress), 1);
                            const smoothProgress = progressAbs * progressAbs * (3 - 2 * progressAbs);
                            
                            // Interpolación directa y suave para todos los casos
                            const interpolatedPos = {
                                x: currentPos.x + (targetPos.x - currentPos.x) * smoothProgress,
                                y: currentPos.y + (targetPos.y - currentPos.y) * smoothProgress
                            };
                            
                            const interpolatedWidth = currentWidth + (targetWidth - currentWidth) * smoothProgress;
                            
                            setTagPosition(interpolatedPos);
                            setTagWidth(interpolatedWidth);
                        }
                    }
                    
                    const baseOffset = -currentEventIndex * 7.14;
                    const carouselEffectiveDiff = Math.abs(diffX) < deadZone ? 0 : diffX - (deadZone * Math.sign(diffX));
                    const carouselPhysicsProgress = Math.tanh(carouselEffectiveDiff / 140) * 0.8;
                    const dragOffset = carouselPhysicsProgress * 7.14;
                    setCarouselOffset(baseOffset - dragOffset);
                }
            };

            const handleMouseEnd = (e) => {
                if (!isSwipping) return;
                
                const endX = e.clientX;
                const diffX = startX - endX;
                
                setIsSwipping(false);
                setIsDraggingTag(false);
                setIsDraggingCarousel(false);
                
                if (Math.abs(diffX) > 45) {
                    if (diffX > 0) {
                        handleArrowDown();
                    } else {
                        handleArrowUp();
                    }
                } else {
                    moveTagToEvent(currentEventIndex);
                    moveCarousel(currentEventIndex);
                }
            };

            const handleArrowDown = () => {
                const nextIndex = (currentEventIndex + 1) % events.length;
                setCurrentEventIndex(nextIndex);
                const nextEvent = events[nextIndex];
                animateEventTransition(nextEvent, nextIndex);
            };

            const handleArrowUp = () => {
                const prevIndex = currentEventIndex === 0 ? events.length - 1 : currentEventIndex - 1;
                setCurrentEventIndex(prevIndex);
                const prevEvent = events[prevIndex];
                animateEventTransition(prevEvent, prevIndex);
            };

            const handleEventTagClick = (event) => {
                const eventIndex = events.findIndex(e => e.id === event.id);
                setCurrentEventIndex(eventIndex);
                animateEventTransition(event, eventIndex);
                setShowBrutalistInfo(true);
            };

            return (
                <div className="min-h-screen bg-black overflow-hidden" style={{ fontFamily: 'Space Mono, monospace', padding: '10px' }}>
                    {/* Gradiente de rayos horizontales en el 1/4 inferior */}
                    <div style={{
                        position: 'fixed',
                        bottom: 0,
                        left: 0,
                        width: '100%',
                        height: '25vh',
                        background: 'linear-gradient(to top, #1a1a2e 0%, #16213e 30%, #0f3460 60%, rgba(15, 52, 96, 0.8) 80%, rgba(15, 52, 96, 0.3) 90%, transparent 100%)',
                        zIndex: 1,
                        pointerEvents: 'none'
                    }} />
                    {/* Logo RAMPA */}
                    <div className="logo-section">
                        <svg className="rampa-logo" width="452" height="154" viewBox="0 0 452 154" fill="none" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                    </div>

                    {/* Sección de Eventos */}
                    <div className="contributors-section">
                        <div className="contributors-tags" ref={tagsContainerRef}>
                            {/* Etiqueta deslizante con physics */}
                            {selectedEvent && eventPositions.length > 0 && isTagVisible && (
                                <div 
                                    className={`sliding-tag ${isDraggingTag ? 'dragging' : ''}`}
                                    style={{
                                        left: `${tagPosition.x}px`,
                                        top: `${tagPosition.y}px`,
                                        width: `${tagWidth}px`
                                    }}
                                />
                            )}

                            {events.map((event, index) => (
                                <div key={event.id} className="event-wrapper">
                                    <span 
                                        className={`event-text ${selectedEvent === event.id ? 'has-tag' : ''}`}
                                        onClick={() => handleEventTagClick(event)}
                                        title={`${event.date} - ${event.time} - ${event.venue}`}
                                    >
                                        {event.name}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Overlay principal */}
                    <div 
                        className={`brutalist-overlay ${showBrutalistInfo ? 'show' : ''}`}
                        ref={overlayRef}
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                        onTouchEnd={handleTouchEnd}
                        onMouseDown={handleMouseStart}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseEnd}
                        onMouseLeave={handleMouseEnd}
                        style={{ userSelect: 'none', touchAction: 'pan-y' }}
                    >
                        {brutalistEventData && (
                            <div className="event-content">
                                <div 
                                    className={`event-carousel ${isDraggingCarousel ? 'dragging' : ''}`}
                                    style={{
                                        transform: `translateX(${carouselOffset}%)`
                                    }}
                                >
                                    {events.map((event, index) => (
                                        <div key={event.id} className="event-slide">
                                            <div className="date-line">
                                                <div className="day-circle">
                                                    <div className="brutalist-text day day-text">{event.day}</div>
                                                </div>
                                                <div className="brutalist-text date">{event.date.replace(/\./g, '-')}</div>
                                                <div className="day-circle">
                                                    <div className="brutalist-text day day-text">{event.day}</div>
                                                </div>
                                            </div>
                                            
                                            <div className="brutalist-text eventname">{event.name}</div>
                                            
                                            {event.venue && event.venue !== event.name && (
                                                <div className="brutalist-text time-label venue-text">{event.venue}</div>
                                            )}
                                            
                                            <div className="brutalist-text time-label">{event.time}H</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Sección inferior simplificada - solo botón + (hidden) */}
                    <div className="final-bottom-buttons">
                        <div className="contributors-tags">
                            <div className="event-wrapper">
                                <span 
                                    className="event-text"
                                    onClick={() => {}}
                                    title="Agregar evento"
                                >
                                    +
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* Barra de scroll inferior */}
                    <div style={{
                        position: 'fixed',
                        bottom: 0,
                        left: 0,
                        width: '100vw',
                        height: '19px',
                        background: '#FD7B1E',
                        zIndex: 100,
                        overflow: 'hidden',
                        display: 'flex',
                        alignItems: 'center'
                    }}>
                        <div style={{
                            whiteSpace: 'nowrap',
                            color: 'black',
                            background: '#FD7B1E',
                            fontSize: '10px',
                            lineHeight: '1.0',
                            animation: 'scroll-left 30s linear infinite',
                            paddingLeft: '100%',
                            paddingTop: '2px',
                            paddingBottom: '2px',
                            fontWeight: 300,
                            letterSpacing: '0.01em',
                            fontFamily: 'Inter, sans-serif',
                            filter: 'blur(0.3px)',
                            minWidth: '20px',
                            boxSizing: 'border-box',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            transform: 'translateY(0px)'
                        }}>
                            Publicá tu evento en Rampa → Escribinos a hola@rampa.world
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<MSCHFEventsBillboard />, document.getElementById('root'));
    </script>
</body>
</html>
