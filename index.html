<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTOS</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&family=Inter:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=new-title@400,700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        
        .brutalist-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 995; opacity: 1;
            transition: opacity 0.3s ease; pointer-events: auto; padding: -4px 20px 20px 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        .event-content { position: relative; width: 100vw; overflow: hidden; margin-left: -20px; margin-right: -20px; margin-top: -60px; }
        .event-carousel { display: flex; transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform; }
        .event-carousel.dragging { transition: none; }
        .event-slide { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 20px; box-sizing: border-box; }

        .brutalist-text {
            font-family: 'Bebas Neue', sans-serif; font-weight: 400; color: #B8B0A3; text-align: center;
            filter: blur(0.3px); padding: 0; margin: 0; line-height: 0.85; letter-spacing: -0.06em;
        }
        .event-slide .brutalist-text.day { font-size: 21px !important; margin-bottom: 4px; }
        .event-slide .brutalist-text.date {
            font-family: 'New Title', 'Bebas Neue', sans-serif !important; font-size: 75px !important; font-weight: 700 !important;
            margin-bottom: 4px; line-height: 0.75; letter-spacing: -0.02em; text-transform: uppercase;
        }
        .date-line { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 4px; }
        .event-slide .day-circle {
            width: 72px !important; height: 72px !important; border: 2px solid #B8B0A3; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transform: scaleY(0.6); position: relative;
        }
        .day-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scaleY(1.67); filter: blur(0.2px); }
        .event-slide .brutalist-text.eventname {
            font-family: 'New Title', 'Bebas Neue', sans-serif !important; font-size: 116px !important; font-weight: 700 !important;
            margin-bottom: 4px; line-height: 0.85; letter-spacing: -0.01em; text-transform: uppercase;
        }
        .event-slide .brutalist-text.time-label { font-size: 31px !important; margin-bottom: 2px; }
        .event-slide .brutalist-text.venue-text { font-size: 35px !important; padding-top: 5px !important; }

        .logo-section { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 998; pointer-events: none; }
        .rampa-logo { width: 120px; height: auto; color: #B8B0A3; filter: blur(0.3px); }

        .contributors-section {
            position: fixed; bottom: 60px; left: 10px; right: 10px; z-index: 998; font-family: 'Inter', sans-serif;
            font-size: 10px; font-weight: 300; color: #B8B0A3; line-height: 1.0; letter-spacing: 0.01em; pointer-events: none; margin-top: 98px;
        }
        .contributors-tags { display: flex; flex-wrap: wrap; gap: 1px; margin-bottom: 8px; position: relative; pointer-events: auto; justify-content: center; }
        .event-wrapper { position: relative; display: inline-block; margin: 0; pointer-events: auto; }

        .sliding-tag {
            position: absolute; background: #B8B0A3; border: none; border-radius: 12px; padding: 2px 4px; font-size: 10px;
            font-weight: 300; color: black; white-space: nowrap; pointer-events: none; z-index: 5; filter: blur(0.3px);
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1); opacity: 1; min-width: 20px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center; height: 14px; transform: translateY(-1px);
            will-change: transform, width, opacity, left, top;
        }
        .sliding-tag.dragging { transition: none; }
        .sliding-tag.smooth-horizontal { transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .sliding-tag.fade-out { transition: opacity 0.3s ease-out; opacity: 0; }
        .sliding-tag.fade-in { transition: opacity 0.4s ease-in; opacity: 1; }

        .event-text {
            color: #B8B0A3; font-size: 10px; font-weight: 300; padding: 2px 4px; cursor: pointer;
            transition: color 0.4s ease, opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); white-space: nowrap;
            display: inline-block; margin: 0; letter-spacing: 0.01em; pointer-events: auto; position: relative;
            z-index: 10; filter: blur(0.3px); line-height: 1.0; box-sizing: border-box;
        }
        .event-text:hover { color: #D4CFC2; }
        .event-text.has-tag { color: black; }

        .add-event-button {
            position: fixed; right: 20px; bottom: calc(40vh - 48px); width: 50px; height: 50px; cursor: pointer;
            transition: all 0.3s ease; pointer-events: auto; z-index: 999; background: transparent;
            border: none; padding: 0; opacity: 0.8;
        }
        .add-event-button:hover { transform: scale(1.1); opacity: 1; }
        .add-event-button.active { transform: scale(0.95); opacity: 1; }
        .add-event-button svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3)); }

        .event-form-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9);
            z-index: 998; display: flex; align-items: center; justify-content: center; opacity: 0;
            visibility: hidden; transition: all 0.3s ease;
        }
        .event-form-overlay.visible { opacity: 1; visibility: visible; }

        .event-form {
            background: #1a1a1a; border: 2px solid #B8B0A3; border-radius: 8px; padding: 30px;
            width: 90%; max-width: 400px; font-family: 'Inter', sans-serif; transform: scale(0.8);
            transition: all 0.3s ease;
        }
        .event-form-overlay.visible .event-form { transform: scale(1); }

        .form-title {
            font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #B8B0A3; text-align: center;
            margin-bottom: 20px; letter-spacing: 1px;
        }
        .form-group { margin-bottom: 15px; }
        .form-label {
            display: block; color: #B8B0A3; font-size: 12px; font-weight: 300; margin-bottom: 5px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-input, .form-select {
            width: 100%; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 10px;
            color: #B8B0A3; font-family: 'Inter', sans-serif; font-size: 14px; box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: #FD7B1E; }
        .form-select { cursor: pointer; }

        .form-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .form-button {
            flex: 1; background: transparent; border: 1px solid #B8B0A3; border-radius: 4px; padding: 10px;
            color: #B8B0A3; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 300;
            cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-button:hover { background: #B8B0A3; color: #1a1a1a; }
        .form-button.submit { border-color: #FD7B1E; color: #FD7B1E; }
        .form-button.submit:hover { background: #FD7B1E; color: #1a1a1a; }
        .form-button:disabled { opacity: 0.5; cursor: not-allowed; }

        .success-message {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #FD7B1E;
            color: #1a1a1a; padding: 15px 25px; border-radius: 4px; font-family: 'Inter', sans-serif;
            font-size: 14px; font-weight: 500; z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .success-message.visible { opacity: 1; visibility: visible; }

        .loading-message {
            color: #B8B0A3; font-family: 'Inter', sans-serif; font-size: 12px; text-align: center;
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;
        }

        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const MSCHFEventsBillboard = () => {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({ nombre: '', fecha: '', hora: '', lugar: '', categoria: 'RAVE' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [selectedEvent, setSelectedEvent] = useState(null);
            const [showBrutalistInfo, setShowBrutalistInfo] = useState(true);
            const [brutalistEventData, setBrutalistEventData] = useState(null);
            const [currentEventIndex, setCurrentEventIndex] = useState(0);
            const [startX, setStartX] = useState(0);
            const [startY, setStartY] = useState(0);
            const [isSwipping, setIsSwipping] = useState(false);
            const overlayRef = useRef(null);
            const [carouselOffset, setCarouselOffset] = useState(0);
            const [isDraggingCarousel, setIsDraggingCarousel] = useState(false);
            const [tagPosition, setTagPosition] = useState({ x: 0, y: 0 });
            const [tagWidth, setTagWidth] = useState(60);
            const [isDraggingTag, setIsDraggingTag] = useState(false);
            const [eventPositions, setEventPositions] = useState([]);
            const [isTagVisible, setIsTagVisible] = useState(true);
            const tagsContainerRef = useRef(null);

            // Función para manejar cambios en el formulario
            const handleFormChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            // Función para abrir/cerrar formulario
            const toggleForm = () => {
                setShowForm(!showForm);
                if (!showForm) {
                    setFormData({ nombre: '', fecha: '', hora: '', lugar: '', categoria: 'RAVE' });
                }
            };

            // Función para enviar evento a Google Sheets (con aprobación)
            const submitEventToGoogleSheets = async (eventData) => {
                // URL de tu Google Apps Script configurada
                const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxC0WXeL-LeSo-7Gp8-ImdsvA4JflgFKO5PWyA00E6PhfqEZMquxRwMpoFtZg-s-E_3g/exec';
                
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // Importante para Google Apps Script
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(eventData)
                    });
                    return { success: true };
                } catch (error) {
                    console.error('Error enviando a Google Sheets:', error);
                    throw error;
                }
            };

            // Función para formatear fecha
            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                if (dateStr.includes('.')) return dateStr;
                
                try {
                    const date = new Date(dateStr);
                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const year = String(date.getFullYear()).slice(-2);
                    return `${day}.${month}.${year}`;
                } catch (e) {
                    return dateStr;
                }
            };

            // Función para obtener día de la semana
            const getDayOfWeek = (dateStr) => {
                try {
                    const date = new Date(dateStr);
                    const days = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
                    return days[date.getDay()];
                } catch (e) {
                    return 'FECHA';
                }
            };

            // Función para manejar envío del formulario
            const handleSubmitEvent = async (e) => {
                e.preventDefault();
                
                if (!formData.nombre || !formData.fecha || !formData.hora) {
                    alert('Por favor completa todos los campos requeridos');
                    return;
                }
                
                setIsSubmitting(true);
                
                try {
                    const day = getDayOfWeek(formData.fecha);
                    const eventToSubmit = {
                        nombre: formData.nombre,
                        fecha: formData.fecha,
                        hora: formData.hora,
                        lugar: formData.lugar,
                        categoria: formData.categoria,
                        dia: day,
                        timestamp: new Date().toISOString()
                    };
                    
                    // Enviar a Google Sheets para aprobación
                    await submitEventToGoogleSheets(eventToSubmit);
                    
                    // Mostrar mensaje de éxito (pendiente de aprobación)
                    const message = document.createElement('div');
                    message.className = 'success-message visible';
                    message.textContent = '¡Evento enviado para revisión!';
                    document.body.appendChild(message);
                    
                    setTimeout(() => message.remove(), 3000);
                    setShowForm(false);
                    
                } catch (error) {
                    alert('Error enviando el evento. Intenta nuevamente.');
                    console.error('Error:', error);
                } finally {
                    setIsSubmitting(false);
                }
            };

            // Cargar eventos desde Excel (como respaldo) o desde Google Sheets aprobados
            useEffect(() => {
                const loadEvents = async () => {
                    try {
                        setLoading(true);
                        
                        // Intentar cargar eventos aprobados desde Google Sheets
                        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxC0WXeL-LeSo-7Gp8-ImdsvA4JflgFKO5PWyA00E6PhfqEZMquxRwMpoFtZg-s-E_3g/exec';
                        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getApprovedEvents`);
                        
                        if (response.ok) {
                            const data = await response.json();
                            if (data.success && data.events.length > 0) {
                                const formattedEvents = data.events.map((event, index) => ({
                                    id: index + 1,
                                    name: event.Nombre || event.nombre,
                                    date: event.Fecha || event.fecha,
                                    time: event.Hora || event.hora,
                                    venue: event.Lugar || event.lugar,
                                    category: event.Categoría || event.categoria,
                                    day: event.Día || event.dia
                                }));
                                setEvents(formattedEvents);
                                setLoading(false);
                                return;
                            }
                        }
                        
                        // Fallback: Usar eventos de ejemplo si no hay Google Sheets configurado
                        const exampleEvents = [
                            { id: 1, name: "Phonoteque", date: "17.08.25", time: "23:00", venue: "FLHEZ, FEFIO, NICOLÁS ARIN B2B STONEM", category: "RAVE", day: "DOMINGO" },
                            { id: 2, name: "Quebrada Festival", date: "22.08.25", time: "20:00", venue: "NICOLÁS JAAR, ANTHEA, LUCIANO SUPERVIELLE", category: "FESTIVAL", day: "VIERNES" },
                            { id: 3, name: "Baum Sessions", date: "23.08.25", time: "22:00", venue: "KLANGKUENSTLER, ÂVALL", category: "RAVE", day: "SÁBADO" },
                            { id: 4, name: "No Sleep Club", date: "24.08.25", time: "23:00", venue: "DANNY AVILA, LOCAL RESIDENTS", category: "CLUB", day: "DOMINGO" },
                            { id: 5, name: "Underworld MVD", date: "29.08.25", time: "23:30", venue: "BEN KLOCK, MARCEL DETTMANN", category: "RAVE", day: "VIERNES" },
                            { id: 6, name: "Electric Park", date: "30.08.25", time: "18:00", venue: "CHARLOTTE DE WITTE, AMELIE LENS", category: "FESTIVAL", day: "SÁBADO" },
                            { id: 7, name: "Mute Night", date: "05.09.25", time: "23:00", venue: "TALE OF US, MIND AGAINST", category: "RAVE", day: "VIERNES" },
                            { id: 8, name: "Cosmic Rave", date: "06.09.25", time: "22:30", venue: "MACEO PLEX, JORIS VOORN", category: "RAVE", day: "SÁBADO" }
                        ];
                        setEvents(exampleEvents);
                        setLoading(false);
                        
                    } catch (error) {
                        console.error('Error cargando eventos:', error);
                        // Usar eventos de ejemplo en caso de error
                        const exampleEvents = [
                            { id: 1, name: "Phonoteque", date: "17.08.25", time: "23:00", venue: "FLHEZ, FEFIO, NICOLÁS ARIN", category: "RAVE", day: "DOMINGO" },
                            { id: 2, name: "Quebrada Festival", date: "22.08.25", time: "20:00", venue: "NICOLÁS JAAR, ANTHEA", category: "FESTIVAL", day: "VIERNES" }
                        ];
                        setEvents(exampleEvents);
                        setLoading(false);
                    }
                };

                loadEvents();
            }, []);

            // Calcular posiciones de eventos
            useEffect(() => {
                if (tagsContainerRef.current && events.length > 0) {
                    const container = tagsContainerRef.current;
                    const eventElements = container.querySelectorAll('.event-text');
                    const positions = Array.from(eventElements).map((element, index) => {
                        const rect = element.getBoundingClientRect();
                        const containerRect = container.getBoundingClientRect();
                        
                        return {
                            id: events[index].id,
                            x: rect.left - containerRect.left,
                            y: rect.top - containerRect.top + (rect.height / 2) - 7,
                            width: rect.width,
                            height: rect.height
                        };
                    });
                    setEventPositions(positions);
                }
            }, [events]);

            // Inicializar primer evento
            useEffect(() => {
                if (events.length > 0) {
                    const firstEvent = events[0];
                    setSelectedEvent(firstEvent.id);
                    setBrutalistEventData(firstEvent);
                    setCurrentEventIndex(0);
                    setCarouselOffset(0);
                    
                    // Configurar etiqueta deslizante
                    setTimeout(() => {
                        if (eventPositions.length > 0) {
                            const firstPosition = eventPositions[0];
                            if (firstPosition) {
                                setTagPosition({ x: firstPosition.x, y: firstPosition.y });
                                setTagWidth(firstPosition.width);
                                setIsTagVisible(true);
                            }
                        }
                    }, 100);
                }
            }, [events, eventPositions]);

            // Funciones para navegación
            const carouselWidth = events.length * 100;
            const slideWidth = events.length > 0 ? (100 / events.length) : 16.67;

            const moveCarousel = (index) => {
                const offset = -index * slideWidth;
                setCarouselOffset(offset);
            };

            const moveTagToEvent = (eventIndex) => {
                if (eventPositions[eventIndex]) {
                    const position = eventPositions[eventIndex];
                    setTagPosition({ x: position.x, y: position.y });
                    setTagWidth(position.width);
                    setIsTagVisible(true);
                }
            };

            const animateEventTransition = (newEvent, newIndex) => {
                moveCarousel(newIndex);
                moveTagToEvent(newIndex);
                setSelectedEvent(newEvent.id);
                setBrutalistEventData(newEvent);
                setCurrentEventIndex(newIndex);
            };

            const handleEventTagClick = (event) => {
                const eventIndex = events.findIndex(e => e.id === event.id);
                animateEventTransition(event, eventIndex);
            };

            const handleArrowDown = () => {
                if (events.length === 0) return;
                const nextIndex = (currentEventIndex + 1) % events.length;
                const nextEvent = events[nextIndex];
                animateEventTransition(nextEvent, nextIndex);
            };

            const handleArrowUp = () => {
                if (events.length === 0) return;
                const prevIndex = currentEventIndex === 0 ? events.length - 1 : currentEventIndex - 1;
                const prevEvent = events[prevIndex];
                animateEventTransition(prevEvent, prevIndex);
            };

            // Touch events para navegación
            const handleTouchStart = (e) => {
                setStartX(e.touches[0].clientX);
                setIsSwipping(true);
            };

            const handleTouchEnd = (e) => {
                if (!isSwipping) return;
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;
                setIsSwipping(false);
                
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        handleArrowDown();
                    } else {
                        handleArrowUp();
                    }
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-black overflow-hidden flex items-center justify-center" style={{ fontFamily: 'Space Mono, monospace' }}>
                        <div className="loading-message">Cargando eventos...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-black overflow-hidden" style={{ fontFamily: 'Space Mono, monospace', padding: '10px' }}>
                    {/* Gradiente de fondo */}
                    <div style={{
                        position: 'fixed', bottom: 0, left: 0, width: '100%', height: '25vh',
                        background: 'linear-gradient(to top, #1a1a2e 0%, #16213e 30%, #0f3460 60%, rgba(15, 52, 96, 0.8) 80%, rgba(15, 52, 96, 0.3) 90%, transparent 100%)',
                        zIndex: 1, pointerEvents: 'none'
                    }} />
                    
                    {/* Logo RAMPA */}
                    <div className="logo-section">
                        <svg className="rampa-logo" width="452" height="154" viewBox="0 0 452 154" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M67.495 54.9663C98.6065 38.1977 131.04 37.9868 139.937 54.4946C148.835 71.0025 130.827 97.9781 99.7157 114.747C68.6044 131.515 36.1708 131.726 27.2734 115.218C18.3763 98.7104 36.3839 71.7348 67.495 54.9663ZM126.693 61.1655C119.111 47.0971 93.2836 46.299 69.0077 59.3833C44.7322 72.4675 31.1999 94.479 38.7821 108.547C46.3648 122.616 72.1918 123.414 96.4677 110.33C120.743 97.2454 134.275 75.2339 126.693 61.1655Z" fill="currentColor"/>
                            <path d="M394.951 114.713C373.073 137.843 345.914 145.245 334.29 131.244C322.666 117.243 330.979 87.1425 352.858 64.0122C374.736 40.882 401.895 33.4808 413.519 47.4813C425.143 61.4822 416.83 91.583 394.951 114.713ZM343.722 121.849C353.628 133.781 375.498 128.823 392.57 110.774C409.641 92.7261 415.45 68.4226 405.544 56.4907C395.637 44.5588 373.768 49.5167 356.696 67.565C339.624 85.6133 333.816 109.917 343.722 121.849Z" fill="currentColor"/>

                        </svg>
                    </div>

                    {/* Lista de eventos con etiqueta deslizante */}
                    <div className="contributors-section">
                        <div className="contributors-tags" ref={tagsContainerRef}>
                            {/* Etiqueta deslizante */}
                            {selectedEvent && eventPositions.length > 0 && isTagVisible && (
                                <div 
                                    className={`sliding-tag ${isDraggingTag ? 'dragging' : ''}`}
                                    style={{
                                        left: `${tagPosition.x}px`,
                                        top: `${tagPosition.y}px`,
                                        width: `${tagWidth}px`
                                    }}
                                />
                            )}

                            {events.map((event, index) => (
                                <div key={event.id} className="event-wrapper">
                                    <span 
                                        className={`event-text ${selectedEvent === event.id ? 'has-tag' : ''}`}
                                        onClick={() => handleEventTagClick(event)}
                                        title={`${event.date} - ${event.time} - ${event.venue}`}
                                    >
                                        {event.name}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Pantalla principal de eventos */}
                    <div 
                        className="brutalist-overlay"
                        ref={overlayRef}
                        onTouchStart={handleTouchStart}
                        onTouchEnd={handleTouchEnd}
                        style={{ userSelect: 'none', touchAction: 'pan-x' }}
                    >
                        {brutalistEventData && (
                            <div className="event-content">
                                <div 
                                    className={`event-carousel ${isDraggingCarousel ? 'dragging' : ''}`}
                                    style={{
                                        transform: `translateX(${carouselOffset}%)`,
                                        width: `${carouselWidth}%`
                                    }}
                                >
                                    {events.map((event, index) => (
                                        <div key={event.id} className="event-slide" style={{ width: `${slideWidth}%` }}>
                                            <div className="date-line">
                                                <div className="day-circle">
                                                    <div className="brutalist-text day day-text">{event.day}</div>
                                                </div>
                                                <div className="brutalist-text date">{event.date.replace(/\./g, '-')}</div>
                                                <div className="day-circle">
                                                    <div className="brutalist-text day day-text">{event.day}</div>
                                                </div>
                                            </div>
                                            
                                            <div className="brutalist-text eventname">{event.name}</div>
                                            
                                            {event.venue && event.venue !== event.name && (
                                                <div className="brutalist-text time-label venue-text">{event.venue}</div>
                                            )}
                                            
                                            <div className="brutalist-text time-label">{event.time}H</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Botón para agregar evento */}
                    <button 
                        className={`add-event-button ${showForm ? 'active' : ''}`}
                        onClick={toggleForm}
                        title="Agregar nuevo evento"
                    >
                        <svg width="50" height="50" viewBox="0 0 260 273" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g clipPath="url(#clip0_1549_5630)">
                                <path d="M260 0H0V273H260V0Z" fill="transparent"/>
                                <path d="M130.5 260C198.707 260 254 204.707 254 136.5C254 68.2928 198.707 13 130.5 13C62.2928 13 7 68.2928 7 136.5C7 204.707 62.2928 260 130.5 260Z" stroke="#FF0000" strokeWidth="8"/>
                                <path d="M211.5 136.021C211.5 140.716 207.695 144.521 203 144.521L150.5 144.521C143.873 144.521 138.5 149.893 138.5 156.521V209.021C138.5 213.715 134.695 217.521 130 217.521C125.306 217.521 121.5 213.715 121.499 209.021V156.521C121.5 149.893 116.128 144.521 109.501 144.521L56.9997 144.521C52.3057 144.521 48.5001 140.715 48.4997 136.021C48.5001 131.326 52.3057 127.521 56.9999 127.521L109.5 127.521C116.128 127.52 121.5 122.148 121.5 115.521L121.5 63.0208C121.5 58.3264 125.306 54.5209 130 54.5209C134.694 54.5209 138.5 58.3264 138.5 63.0209L138.5 115.521C138.5 122.149 143.872 127.521 150.5 127.52L203 127.521C207.695 127.521 211.5 131.327 211.5 136.021Z" fill="#FF0000"/>
                            </g>
                            <defs>
                                <clipPath id="clip0_1549_5630">
                                    <rect width="260" height="273" fill="white"/>
                                </clipPath>
                            </defs>
                        </svg>
                    </button>

                    {/* Formulario modal para agregar evento */}
                    <div className={`event-form-overlay ${showForm ? 'visible' : ''}`}>
                        <form className="event-form" onSubmit={handleSubmitEvent}>
                            <h2 className="form-title">Agregar Evento</h2>
                            
                            <div className="form-group">
                                <label className="form-label">Nombre del Evento *</label>
                                <input 
                                    type="text"
                                    className="form-input"
                                    value={formData.nombre}
                                    onChange={(e) => handleFormChange('nombre', e.target.value)}
                                    placeholder="Ej: Baum Sessions"
                                    required
                                />
                            </div>

                            <div className="form-group">
                                <label className="form-label">Fecha *</label>
                                <input 
                                    type="date"
                                    className="form-input"
                                    value={formData.fecha}
                                    onChange={(e) => handleFormChange('fecha', e.target.value)}
                                    required
                                />
                            </div>

                            <div className="form-group">
                                <label className="form-label">Hora *</label>
                                <input 
                                    type="time"
                                    className="form-input"
                                    value={formData.hora}
                                    onChange={(e) => handleFormChange('hora', e.target.value)}
                                    required
                                />
                            </div>

                            <div className="form-group">
                                <label className="form-label">Lugar / Artistas</label>
                                <input 
                                    type="text"
                                    className="form-input"
                                    value={formData.lugar}
                                    onChange={(e) => handleFormChange('lugar', e.target.value)}
                                    placeholder="Ej: KLANGKUENSTLER, ÂVALL"
                                />
                            </div>

                            <div className="form-group">
                                <label className="form-label">Categoría</label>
                                <select 
                                    className="form-select"
                                    value={formData.categoria}
                                    onChange={(e) => handleFormChange('categoria', e.target.value)}
                                >
                                    <option value="RAVE">RAVE</option>
                                    <option value="FESTIVAL">FESTIVAL</option>
                                    <option value="CLUB">CLUB</option>
                                    <option value="CONCIERTO">CONCIERTO</option>
                                    <option value="EVENTO">EVENTO</option>
                                </select>
                            </div>

                            <div className="form-buttons">
                                <button 
                                    type="button" 
                                    className="form-button"
                                    onClick={toggleForm}
                                    disabled={isSubmitting}
                                >
                                    Cancelar
                                </button>
                                <button 
                                    type="submit" 
                                    className="form-button submit"
                                    disabled={isSubmitting}
                                >
                                    {isSubmitting ? 'Enviando...' : 'Enviar'}
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* Barra inferior con texto desplazante - REMOVIDA */}
                </div>
            );
        };

        ReactDOM.render(<MSCHFEventsBillboard />, document.getElementById('root'));
    </script>
</body>
</html>
